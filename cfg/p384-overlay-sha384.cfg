# cfg/p384-overlay-sha384.cfg — ld65 config for the SHA-384 half of the
# split P-384 overlay (Phase 1.5).
#
# Phase 1b's monolithic OVERLAY_P384 (12,836 B) overflowed the live UCI
# CRYPTO_OVERLAY slot (7,680 B / 7.5 KB at $4200-$5FFF).  The fix is to
# load the SHA-384 hash code and the curve / verify code as two separate
# overlay images; only one is resident at a time.  The TLS path drives
# them in sequence:
#   1. swap-in sha384 overlay -> sha384_init / update* / final
#   2. swap-in curve  overlay -> ecdsa_verify_384 (digest pre-staged in
#                                ecdsa_inputs_384[96..143] in resident DATA)
#
# The DATA / BSS exports stay in CRYPTO_RESIDENT (the same slot Phase 1b
# pinned them at, $C000) so the SHA digest survives the swap window
# between sha384_final and ecdsa_verify_384.  See Phase 1b's
# build_nistcurves_p384.sh + the comment block at the top of
# src/crypto/shared/crypto_swap.s for the full rationale.
#
# Layout matches the live UCI CRYPTO_OVERLAY base ($4200) and size
# ($1E00 = 7.5 KB) so the .bin DMAs into the live slot cleanly at
# harness time.

FEATURES {
    STARTADDRESS: default = $4200;
}

MEMORY {
    ZP:             start = $0022, size = $001E, type = rw, define = yes;
    OVERLAY_REGION: start = $4200, size = $1E00, file = %O, define = yes,
                    fill = yes, fillval = $00;
    RESIDENT:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE:               load = ZP,             type = zp,  optional = yes;

    OVERLAY_P384_SHA384:    load = OVERLAY_REGION, type = ro;

    # Resident RW buffers — we don't write them to the .bin, but they
    # need real addresses so labels are correct.
    DATA:                   load = RESIDENT,       type = rw,  optional = yes;
    BSS:                    load = RESIDENT,       type = bss, optional = yes;
}
