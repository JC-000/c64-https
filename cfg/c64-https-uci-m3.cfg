# cfg/c64-https-uci-m3.cfg — BACKEND=uci-m3: HTTPS with TLS on the
# Ultimate's ESP32 (M3 firmware). No 6510 crypto is linked, so the image is
# small and the map is plain:
#
#   $0801-$9FFF  MAIN    BASIC stub, boot, HTTP, the M3 adapter (file)
#   $A000-$B9FF  SHADOW  every BSS segment (RAM under BASIC ROM; boot.s
#                        zeroes $A000-$BFFF and banks BASIC out first)
#   $BA00-$BFFF  TABLES  TABLES_BSS, pinned so the Makefile's post-link
#                        sqtab_lo == $BC00 check holds as on every profile
#   $C000-$CFFF          the rx ring (tcp_recv_buf, an equate)
FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $97FF, file = %O, define = yes;
    SHADOW:   start = $A000, size = $1A00, type = rw, define = yes;
    TABLES:   start = $BA00, size = $0600, type = rw, define = yes;
}

SEGMENTS {
    LOADADDR:            load = LOADADDR, type = ro;
    EXEHDR:              load = MAIN, type = ro;
    CODE:                load = MAIN, type = ro;
    LOADER_OVERFLOW:     load = MAIN, type = ro;
    TLS_CODE:            load = MAIN, type = ro, optional = yes;
    HTTP_AUX_CODE:       load = MAIN, type = ro;
    HTTP_AUX_CODE2:      load = MAIN, type = ro;
    HTTP_SINK_CODE:      load = MAIN, type = ro;
    TARGET_PROMPT_CODE:  load = MAIN, type = ro;
    UCI_CODE:            load = MAIN, type = ro;
    CRYPTO_CODE:         load = MAIN, type = ro, optional = yes;
    CRYPTO_AUX_CODE:     load = MAIN, type = ro, optional = yes;
    VIEWER_CODE:         load = MAIN, type = ro, optional = yes;
    RODATA:              load = MAIN, type = ro;
    HTTPS_TARGET_RODATA: load = MAIN, type = ro;
    BSS:                 load = SHADOW, type = bss;
    BSS_TAIL:            load = SHADOW, type = bss;
    UCI_BSS:             load = SHADOW, type = bss;
    NET_BSS_TAIL:        load = SHADOW, type = bss, optional = yes;
    TABLES_BSS:          load = TABLES, type = bss, align = $100;
}
