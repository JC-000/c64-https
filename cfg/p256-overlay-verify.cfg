# cfg/p256-overlay-verify.cfg -- ld65 config for the P-256 verify overlay
# image (W3 library-ingestion architecture).
#
# Mirrors cfg/p384-overlay-{sha384,curve}.cfg.  Produces a padded .bin
# image that the boot stash (reu_p384_overlay_init in src/boot.s) loads
# into REU bank 2 slot $22100 (REU_OVERLAY_P256_VERIFY).  Subsequent
# `crypto_swap_to_p256_verify` calls DMA the bytes back into the live
# CRYPTO_OVERLAY slot at $4200-$5FFF.
#
# The DATA / BSS exports stay at $C000 (matches the standalone P-384
# overlay cfgs' RESIDENT layout).  Under c64-https's main UCI cfg these
# RW buffers live in CRYPTO_BSS at $A000+; for the overlay-image link
# we just need stable addresses to satisfy linker references -- the
# .bin itself contains only the OVERLAY_P256_VERIFY segment bytes.
#
# Layout matches the live UCI CRYPTO_OVERLAY base ($4200) and size
# ($1E00 = 7,680 B / 7.5 KB) so the .bin DMAs into the live slot
# cleanly at harness time.

FEATURES {
    STARTADDRESS: default = $4200;
}

MEMORY {
    ZP:             start = $0022, size = $001E, type = rw, define = yes;
    OVERLAY_REGION: start = $4200, size = $1E00, file = %O, define = yes,
                    fill = yes, fillval = $00;
    RESIDENT:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE:                       load = ZP,             type = zp,  optional = yes;

    # W5: new library segment names (c64-lib-contract / libs/nistcurves
    # cfa9085+) are the canonical set under the contract. The legacy
    # OVERLAY_P256_VERIFY alias + CRYPTO_CODE/RODATA aliases stay for
    # backward compat with any in-tree force-link path that hasn't
    # migrated yet.
    OVERLAY_P256_VERIFY:            load = OVERLAY_REGION, type = ro, optional = yes;
    LIB_NISTCURVES_P256_CODE:       load = OVERLAY_REGION, type = ro, optional = yes;
    LIB_NISTCURVES_P256_RODATA:     load = OVERLAY_REGION, type = ro, optional = yes;
    CRYPTO_CODE:                    load = OVERLAY_REGION, type = ro, optional = yes;
    CRYPTO_RODATA:                  load = OVERLAY_REGION, type = ro, optional = yes;
    RODATA:                         load = OVERLAY_REGION, type = ro, optional = yes;
    CODE:                           load = OVERLAY_REGION, type = ro, optional = yes;

    # Resident RW buffers -- we don't write them to the .bin, but they
    # need real addresses so labels are correct.
    DATA:                           load = RESIDENT,       type = rw,  optional = yes;
    BSS:                            load = RESIDENT,       type = bss, optional = yes;
    CRYPTO_BSS:                     load = RESIDENT,       type = bss, optional = yes;
    LIB_NISTCURVES_P256_BSS:        load = RESIDENT,       type = bss, optional = yes;
    ZEROPAGE_BSS:                   load = ZP,             type = bss, optional = yes;
}
