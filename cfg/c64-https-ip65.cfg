# c64-https ld65 config — ip65/RR-Net backend
#
# Memory map (post-W1 hot/cold split — see comment block at the MEMORY
# entry for the fit constraints):
#   $0801-$1FFF : LOADER             (BASIC stub + boot + tls + http + net wrapper)
#   $2000-$3FFF : NET_CODE           (ip65 blob + LOADER_OVERFLOW tail +
#                                     CRYPTO_AUX_CODE2)
#   $4000-$4F8B : NET_BSS            (ip65 blob's BSS — physical occupancy
#                                     stops at $4F8B per ip65-build/ip65-c64.map)
#   $4F8C-$5FFF : CRYPTO_OVERLAY     (4,212 B reclaimed BSS-TAIL slot — used
#                                     under W2 as overlay slot for ip65; same
#                                     role as UCI's CRYPTO_OVERLAY at $4200.
#                                     Now reserved for future P-384/SHA-384
#                                     overlay use; BSS no longer routed here.)
#   $6000-$9FFF : CRYPTO_RESIDENT    (16 KB file-backed — code + rodata.
#                                     Stays below $A000 because boot zeros
#                                     $A000-$BFFF as zero-init BSS.)
#   $A000-$BFFF : CRYPTO_COLD_SHADOW  (8 KB file-backed — large BSS chunks
#                                     under banked-on RAM; zero-filled in
#                                     PRG, overwritten at runtime.)
#   $C000-$CFFF : TCP_BUF            (tcp_recv_buf, 4 KB ring)
#
# CPU port $01 is set to $36 at boot (BASIC ROM off), so $8000-$BFFF is
# plain RAM under what would otherwise be BASIC ROM shadow + the top of
# the character ROM gap.
#
# --- W1 hot/cold split (Worker I — root-cause fix for the boot
# zero-fill regression on the UCI side; partial fit on ip65). ---
#
# Pre-W1 ip65 had `CRYPTO_RESIDENT` spanning the full 24 KB
# $6000-$BFFF as a single file-backed region. Worker F's W2 attempt
# carved $4F8C-$5FFF out of NET_BSS as `CRYPTO_OVERLAY` and re-routed
# TABLES_BSS / LIB_NISTCURVES_P256_BSS / BSS_TAIL there; the 4,212 B
# slot proved 1,024 B short of those three combined.
#
# The W1 split addresses the cross-cutting correctness issue
# symmetrically with the UCI cfg:
#
#   CRYPTO_RESIDENT      $6000-$9FFF  16 KB file-backed. Code + rodata
#                                     plus TLS_CODE / CRYPTO_AUX_CODE in
#                                     the small fraction that fits.
#                                     Stays below $A000 so the boot
#                                     zbss loop in src/boot.s (which
#                                     wipes $A000-$BFFF as zero-init
#                                     BSS) cannot wipe any executable
#                                     bytes. Under the bumped library
#                                     (cfa9085) LIB_NISTCURVES_P256_CODE
#                                     would otherwise have straddled
#                                     $A000 and been silently zeroed —
#                                     the production regression that
#                                     this split closes.
#   CRYPTO_OVERLAY       $4F8C-$5FFF  4,212 B. Holds TLS_CODE +
#                                     CRYPTO_AUX_CODE (Phase C.4
#                                     placement) under the W1 split,
#                                     freeing CRYPTO_RESIDENT for the
#                                     resident P-256 verify path +
#                                     in-tree TLS app-data primitives.
#                                     Future P-384 / SHA-384 / X25519
#                                     sibling overlay segments are
#                                     declared `optional = yes` here.
#   CRYPTO_COLD_SHADOW   $A000-$BFFF   8 KB file-backed (zero-filled).
#                                     BSS chunks land here.
#
# RESIDUAL FIT ISSUE: the total c64-https + libs/nistcurves BSS claim
# (BSS 4,478 B + CRYPTO_BSS 21 B + TABLES_BSS 1,536 B page-aligned +
# BSS_TAIL 2,084 B + LIB_NISTCURVES_P256_BSS 1,573 B = ~9,692 B before
# alignment) exceeds the 8 KB CRYPTO_COLD_SHADOW budget by ~1.5 KB.
# ld65 surfaces a `BSS overflows CRYPTO_COLD_SHADOW by 1662 bytes`
# warning + a non-zero exit. Cfg-only relief is exhausted under the
# bumped library (see Worker I's trace at the W15 review). Resolution
# requires one of:
#   (a) Library-side minimal-archive variant — drop data_p256 anchor
#       RAM or audit data_p256.o for unused scratch (~1 KB+).
#   (b) Source-level BSS split — partition src/data.s BSS into a
#       hot/cold pair so cold-path BSS can be routed elsewhere
#       (~1.5 KB+).
#   (c) Defer-paging — SHA-384 / P-384 overlay-paging strategy
#       extended to a c64-https in-tree BSS slice.
#
# UCI is unaffected (62977 B PRG builds clean under W1) — under UCI
# the NET_CODE region absorbs TLS_CODE+CRYPTO_AUX_CODE+CRYPTO_AUX_CODE2
# (the UCI adapter is ~1.7 KB vs ip65's 6.95 KB blob), opening enough
# CRYPTO_RESIDENT slack to leave BSS budget intact.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_IP65:       start = $0002, size = $001A, type = rw, define = yes;
    ZP_CRYPTO:     start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:       start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:      start = $07FF, size = $0002, file = %O;
    LOADER:        start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    NET_CODE:      start = $2000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    # NET_BSS holds the ip65 blob's BSS ($4000-$4F8B per ip65-build/
    # ip65-c64.map). The blob's reserved BSS stops exactly at $4F8B;
    # the remainder of the original $4000-$5FFF span is reclaimed
    # below as CRYPTO_OVERLAY.
    NET_BSS:        start = $4000, size = $0F8C, file = %O, define = yes, fill = yes, fillval = $00;
    # CRYPTO_OVERLAY: the historical W2 reclaimed BSS-TAIL slot at
    # $4F8C-$5FFF (4,212 B). Under the W1 hot/cold split this slot
    # absorbs TLS_CODE + CRYPTO_AUX_CODE (Phase C.4 placement, 3,760 B,
    # 452 B headroom). Future P-384 + SHA-384 archives are anchored
    # here (`optional = yes`, zero bytes today). file-backed so any
    # leftover content lands zero-filled in the PRG.
    CRYPTO_OVERLAY:     start = $4F8C, size = $1074, file = %O, define = yes, fill = yes, fillval = $00;
    # 16 KB code+rodata stays below $A000 so boot's zbss zero-fill of
    # $A000-$BFFF cannot wipe any executable bytes.
    CRYPTO_RESIDENT:    start = $6000, size = $4000, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO_COLD_SHADOW: start = $A000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;

    # Phase 3: ip65 backend does NOT embed the P-384 split overlay
    # blobs (no room in main RAM after the existing layout, and ip65
    # is the production X25519-only path that never calls into P-384).
    # The OVERLAY_BLOB_SHA384 / OVERLAY_BLOB_CURVE segments below are
    # `optional = yes` and stay empty under ip65; their MEMORY anchors
    # are zero-size aliases just to give ld65 valid load addresses
    # for the segment names referenced from src/crypto/shared/.
    OVERLAY_BLOB_CURVE_RAM: start = $E000, size = $0000, type = rw, define = yes;

    TCP_BUF:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZP_SHARED:     load = ZP_IP65,        type = zp,  optional = yes;
    ZEROPAGE:      load = ZP_CRYPTO,      type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,        type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,       type = ro;
    EXEHDR:        load = LOADER,         type = ro;
    STARTUP:       load = LOADER,         type = ro,  optional = yes;
    CODE:          load = LOADER,         type = ro;
    RODATA:        load = CRYPTO_RESIDENT, type = ro;
    INIT:          load = LOADER,         type = ro,  optional = yes;

    NET_CODE:      load = NET_CODE,       type = ro;
    # LOADER-overflow rides along with the ip65 blob in the NET_CODE tail.
    # CRYPTO_AUX_CODE2 (hmac_drbg alone) also rides the NET_CODE tail to
    # spread crypto code across NET_CODE / CRYPTO_RESIDENT / CRYPTO_OVERLAY.
    LOADER_OVERFLOW:  load = NET_CODE,    type = ro,  optional = yes;
    CRYPTO_AUX_CODE2: load = NET_CODE,    type = ro,  optional = yes;
    NET_BSS:       load = NET_BSS,        type = bss, optional = yes;

    # --- W1 hot/cold split: BSS catch-alls land in CRYPTO_COLD_SHADOW. ---
    # The total in-tree + library BSS claim (~9.7 KB) exceeds the 8 KB
    # CRYPTO_COLD_SHADOW budget. The residual overflow is surfaced at
    # link time; the supervisor must decide between source-level BSS
    # split, library-side minimal-archive variant, or another overlay
    # paging strategy (see the MEMORY entry header).
    LIB_NISTCURVES_P256_BSS: load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    # BSS_TAIL hosts the cert_buf (1.5 KB) + tls_rec_buf (548 B) per
    # src/data.s and src/der_decode.s.
    BSS_TAIL:      load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    TABLES_BSS:    load = CRYPTO_COLD_SHADOW, type = bss, align = $100;

    # --- Resident crypto + TLS code / rodata. ---
    # W1 hot/cold split: TLS_CODE + CRYPTO_AUX_CODE ride the historical
    # W2 CRYPTO_OVERLAY slot ($4F8C-$5FFF, 4,212 B), restoring their
    # Phase C.4 placement. CRYPTO_RESIDENT keeps the resident P-256
    # verify path + chacha20/poly1305 + TLS app-data primitives + rodata
    # below $A000.
    TLS_CODE:        load = CRYPTO_OVERLAY,  type = ro,  optional = yes;
    CRYPTO_AUX_CODE: load = CRYPTO_OVERLAY,  type = ro,  optional = yes;
    CRYPTO_CODE:   load = CRYPTO_RESIDENT, type = ro;
    CRYPTO_RODATA: load = CRYPTO_RESIDENT, type = ro;
    # libs/nistcurves segment names (c64-lib-contract / cfa9085+).
    # Default: P-256 always-resident in CRYPTO_RESIDENT (matches UCI's
    # CRYPTO_HOT default). MUL / TABLES / shared-BSS segments are
    # declared `optional = yes` for forward-compat (the minimal P-256
    # archive built by tools/integration/build_nistcurves_p256.sh
    # excludes data_shared.o + mul_8x8.o, so these segments receive
    # zero bytes today; they would land in CRYPTO_RESIDENT if a future
    # archive includes them).
    LIB_NISTCURVES_P256_CODE:     load = CRYPTO_RESIDENT, type = ro,  optional = yes;
    LIB_NISTCURVES_P256_RODATA:   load = CRYPTO_RESIDENT, type = ro,  optional = yes;
    LIB_NISTCURVES_BSS:           load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    LIB_NISTCURVES_TABLES:        load = CRYPTO_COLD_SHADOW, type = bss, optional = yes, align = $100;
    LIB_NISTCURVES_MUL_CODE:      load = CRYPTO_RESIDENT, type = ro,  optional = yes;
    # P-384 + SHA-384 routed to CRYPTO_OVERLAY (the reclaimed
    # BSS-TAIL slot). Mirrors UCI's overlay-resident routing for the
    # same segments. Zero bytes today (no P-384 archive linked under
    # ip65); future wiring picks them up here without further cfg
    # change. P-384 / SHA-384 BSS lives in CRYPTO_COLD_SHADOW (read/write
    # state, BSS-only, not file-backed code).
    LIB_NISTCURVES_P384_CODE:     load = CRYPTO_OVERLAY,  type = ro,  optional = yes;
    LIB_NISTCURVES_P384_RODATA:   load = CRYPTO_OVERLAY,  type = ro,  optional = yes;
    LIB_NISTCURVES_P384_BSS:      load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    LIB_NISTCURVES_P384_DATA_BSS: load = CRYPTO_COLD_SHADOW, type = rw,  optional = yes;
    LIB_NISTCURVES_SHA384_CODE:   load = CRYPTO_OVERLAY,  type = ro,  optional = yes;
    LIB_NISTCURVES_SHA384_RODATA: load = CRYPTO_OVERLAY,  type = ro,  optional = yes;
    LIB_NISTCURVES_SHA384_TABLES: load = CRYPTO_OVERLAY,  type = ro,  optional = yes, align = $100;
    LIB_NISTCURVES_SHA384_BSS:    load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    RESIDENT_RODATA: load = CRYPTO_RESIDENT, type = ro, optional = yes;

    # Phase C.5: sibling c64-x25519 rodata + bss segments. Under ip65
    # CRYPTO_OVERLAY is now real ($4F8C-$5FFF, 4,212 B); the segments
    # are anchored there for forward-compat under USE_X25519_SIBLING=1.
    # Page alignment respected.
    X25519_RODATA:  load = CRYPTO_OVERLAY, type = ro,  optional = yes, align = $100;
    X25519_BSS:     load = CRYPTO_OVERLAY, type = bss, optional = yes, align = $100;

    # --- Resident BSS. Catch-all c64-https in-tree BSS (src/data.s
    # `.segment "BSS"`). Routed to CRYPTO_COLD_SHADOW under the W1
    # hot/cold split; CRYPTO_RESIDENT now carries code+rodata only.
    BSS:           load = CRYPTO_COLD_SHADOW, type = bss;
    CRYPTO_BSS:    load = CRYPTO_COLD_SHADOW, type = bss;

    # Phase 3: ip65 backend stays at the historical 47 KB PRG size --
    # USE_OVERLAY_P384_EMBED is gated off in the Makefile under ip65,
    # so src/crypto/shared/p384_overlay_blobs.s emits no bytes and
    # both segments below stay empty.  The segment declarations are
    # kept (`optional = yes`) so the cfg parses identically across
    # backends and the ip65/UCI link line stays uniform.
    OVERLAY_BLOB_SHA384: load = CRYPTO_OVERLAY,         type = ro, optional = yes;
    OVERLAY_BLOB_CURVE:  load = OVERLAY_BLOB_CURVE_RAM, type = ro, optional = yes;

    # W3: P-256 verify overlay blob (segment placeholder).  Mirrors the
    # UCI cfg's slot so src/crypto/shared/p256_overlay_blobs.s links
    # cleanly even though ip65 has no live overlay slot and the .ifdef
    # USE_OVERLAY_P256_EMBED guard keeps the segment empty regardless.
    OVERLAY_BLOB_P256:   load = CRYPTO_OVERLAY,        type = ro, optional = yes;

    TCP_RECV_BUF:  load = TCP_BUF,         type = bss, optional = yes;
}
