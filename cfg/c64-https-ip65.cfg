# c64-https ld65 config — ip65/RR-Net backend
#
# Memory map:
#   $0801-$1FFF : LOADER           (BASIC stub + boot + tls + http + net wrapper)
#   $2000-$3FFF : NET_CODE         (ip65 blob + LOADER_OVERFLOW tail)
#   $4000-$5FFF : NET_BSS          (ip65 BSS, fully used)
#   $6000-$BFFF : CRYPTO_RESIDENT  (24 KB — covers old CRYPTO + SHADOW_BSS span)
#   $C000-$CFFF : TCP_BUF          (tcp_recv_buf, 4 KB ring)
#
# The in-tree src/crypto/x25519.s + src/crypto/fe25519.s provide
# the x25519 primitives under ip65. Phase C.1 attempted a sibling-lib
# overlay integration under BACKEND=uci only; that integration was
# rolled back (see cfg/c64-https-uci.cfg for details). ip65 never
# adopted the overlay, so this cfg is unchanged from the Phase C.0
# single contiguous CRYPTO_RESIDENT layout.
#
# CPU port $01 is set to $36 at boot (BASIC ROM off), so $8000-$BFFF is
# plain RAM under what would otherwise be BASIC ROM shadow + the top of
# the character ROM gap.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_IP65:       start = $0002, size = $001A, type = rw, define = yes;
    ZP_CRYPTO:     start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:       start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:      start = $07FF, size = $0002, file = %O;
    LOADER:        start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    NET_CODE:      start = $2000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    # Phase C.4: NET_BSS is split into the ip65-blob-owned portion
    # ($4000-$4F8B per ip65-build/ip65-c64.map, rounded up to $4F8C =
    # $F8C B) and a tail slack region reused for TLS_CODE + CRYPTO_AUX_CODE
    # relocation.  Sibling P-256 integration pushed CRYPTO_RESIDENT over
    # its 24 KB budget under ip65; UCI had NET_BSS at only $4000-$41FF so
    # it already had headroom.  The blob's reserved BSS stops exactly at
    # $4F8B; NET_BSS_TAIL starts at the next byte so no blob state is
    # clobbered by the relocated code.
    NET_BSS:         start = $4000, size = $0F8C, file = %O, define = yes, fill = yes, fillval = $00;
    NET_BSS_TAIL:    start = $4F8C, size = $1074, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO_RESIDENT: start = $6000, size = $6000, file = %O, define = yes, fill = yes, fillval = $00;

    # CRYPTO_OVERLAY is not used under ip65 (no REU-overlay swapping).
    # A zero-size rw alias is declared here only to satisfy
    # `crypto_swap.s`'s `.import __CRYPTO_OVERLAY_START__` -- ip65
    # never actually issues the DMA, so the address value is unused.
    CRYPTO_OVERLAY: start = $6000, size = $0000, type = rw, define = yes;

    # Phase 3: ip65 backend does NOT embed the P-384 split overlay
    # blobs (no room in main RAM after the existing layout, and ip65
    # is the production X25519-only path that never calls into P-384).
    # The OVERLAY_BLOB_SHA384 / OVERLAY_BLOB_CURVE segments below are
    # `optional = yes` and stay empty under ip65; their MEMORY anchors
    # are zero-size aliases just to give ld65 valid load addresses
    # for the segment names referenced from src/crypto/shared/.
    OVERLAY_BLOB_CURVE_RAM: start = $E000, size = $0000, type = rw, define = yes;

    TCP_BUF:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZP_SHARED:     load = ZP_IP65,        type = zp,  optional = yes;
    ZEROPAGE:      load = ZP_CRYPTO,      type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,        type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,       type = ro;
    EXEHDR:        load = LOADER,         type = ro;
    STARTUP:       load = LOADER,         type = ro,  optional = yes;
    CODE:          load = LOADER,         type = ro;
    RODATA:        load = CRYPTO_RESIDENT, type = ro;
    INIT:          load = LOADER,         type = ro,  optional = yes;

    NET_CODE:      load = NET_CODE,       type = ro;
    # LOADER-overflow rides along with the ip65 blob in the NET_CODE tail.
    # Phase C.4: CRYPTO_AUX_CODE2 (hmac_drbg alone) also rides the NET_CODE
    # tail under ip65 because TLS_CODE + sha256's CRYPTO_AUX_CODE together
    # would overflow NET_BSS_TAIL by 23 bytes if hmac_drbg were co-located
    # there.  NET_CODE has ~1 KB of tail slack after the ip65 blob +
    # LOADER_OVERFLOW, which covers hmac_drbg's ~830 B.  sha256 rides
    # NET_BSS_TAIL alongside TLS_CODE.
    LOADER_OVERFLOW:  load = NET_CODE,    type = ro,  optional = yes;
    CRYPTO_AUX_CODE2: load = NET_CODE,    type = ro,  optional = yes;
    NET_BSS:       load = NET_BSS,        type = bss, optional = yes;
    # Phase C.4: TLS_CODE + CRYPTO_AUX_CODE (sha256) relocate out of
    # CRYPTO_RESIDENT into NET_BSS_TAIL.  hmac_drbg (CRYPTO_AUX_CODE2)
    # goes to NET_CODE instead — see the NET_CODE SEGMENTS block.
    TLS_CODE:        load = NET_BSS_TAIL, type = ro,  optional = yes;
    CRYPTO_AUX_CODE: load = NET_BSS_TAIL, type = ro,  optional = yes;

    # --- Overlay slot placeholders (unused under ip65). ---
    # Declared `optional = yes` + `load = CRYPTO_RESIDENT` as harmless
    # anchors so shared code that references the segment names still
    # links; they receive no bytes under ip65 because no overlay
    # archives are linked.
    OVERLAY_P256:   load = CRYPTO_RESIDENT, type = ro, optional = yes;
    OVERLAY_P384:   load = CRYPTO_RESIDENT, type = ro, optional = yes;

    # Phase C.5: sibling c64-x25519 rodata + bss segments. Under ip65
    # there is no spare 4 KB region available — CRYPTO_OVERLAY is a
    # zero-sized alias and NET_BSS_TAIL/NET_CODE both have <1 KB of
    # slack. The segments are anchored at CRYPTO_RESIDENT and will
    # overflow by ~3.3 KB under USE_X25519_SIBLING=1 until the cfg is
    # restructured. Reported as a partial blocker for the integrator;
    # USE_X25519_SIBLING=1 works under BACKEND=uci where CRYPTO_OVERLAY
    # provides the headroom.
    X25519_RODATA:  load = CRYPTO_RESIDENT, type = ro,  optional = yes, align = $100;
    X25519_BSS:     load = CRYPTO_RESIDENT, type = bss, optional = yes, align = $100;

    # --- Resident crypto + TLS code / rodata. ---
    # Phase C.2 backend-divergence: under UCI, TLS_CODE and CRYPTO_AUX_CODE
    # (SHA-256 + HMAC-DRBG + ecdsa_verify dispatcher) relocate to NET_CODE
    # to free headroom for Phase C.3 overlays.  Phase C.4 gives ip65 the
    # same treatment but routes them into NET_BSS_TAIL instead (NET_CODE
    # is ~88% full with the ip65 blob under ip65).
    CRYPTO_CODE:   load = CRYPTO_RESIDENT, type = ro;
    CRYPTO_RODATA: load = CRYPTO_RESIDENT, type = ro;
    RESIDENT_RODATA: load = CRYPTO_RESIDENT, type = ro, optional = yes;

    # --- Resident BSS. Everything that used to live in SHADOW_BSS now
    # shares CRYPTO_RESIDENT; TABLES_BSS keeps page alignment.
    BSS:           load = CRYPTO_RESIDENT, type = bss;
    CRYPTO_BSS:    load = CRYPTO_RESIDENT, type = bss;
    TABLES_BSS:    load = CRYPTO_RESIDENT, type = bss, align = $100;

    # Phase 3: ip65 backend stays at the historical 47 KB PRG size --
    # USE_OVERLAY_P384_EMBED is gated off in the Makefile under ip65,
    # so src/crypto/shared/p384_overlay_blobs.s emits no bytes and
    # both segments below stay empty.  The segment declarations are
    # kept (`optional = yes`) so the cfg parses identically across
    # backends and the ip65/UCI link line stays uniform.
    OVERLAY_BLOB_SHA384: load = CRYPTO_OVERLAY,         type = ro, optional = yes;
    OVERLAY_BLOB_CURVE:  load = OVERLAY_BLOB_CURVE_RAM, type = ro, optional = yes;

    TCP_RECV_BUF:  load = TCP_BUF,         type = bss, optional = yes;
}
