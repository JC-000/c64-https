# c64-https ld65 config — ip65/RR-Net backend
#
# Transitional Phase C.0 memory map (REU-overlay design, deferred overlay):
#   $0801-$1FFF : LOADER           (BASIC stub + boot + tls + http + net wrapper)
#   $2000-$3FFF : NET_CODE         (ip65 blob + LOADER_OVERFLOW tail)
#   $4000-$5FFF : NET_BSS          (ip65 BSS, fully used)
#   $6000-$BFFF : CRYPTO_RESIDENT  (24 KB — covers old CRYPTO + SHADOW_BSS span)
#   $C000-$CFFF : TCP_BUF          (tcp_recv_buf, 4 KB ring)
#
# --- Phase C.0 transitional note ---
# The "Phase B final decision" in
# /home/someone/.claude/plans/synchronous-baking-curry.md calls for a
# CRYPTO_OVERLAY region at $6000-$7FFF (8 KB) plus a trimmed
# CRYPTO_RESIDENT at $8000-$BFFF (16 KB) under ip65. That layout only
# fits once Phases C.1-.3 land: (a) Profile B ccp replaces the current
# in-tree chacha20/poly1305 (saves the 8 KB Shoup r_tab BSS) and (b)
# trimmed sibling libs replace the in-tree x25519/fe25519/ecdsa code.
# Until then, a 16 KB CRYPTO_RESIDENT cannot hold the legacy CRYPTO
# region contents + the former SHADOW_BSS contents (observed overflow
# 5,429 B against BSS).
#
# Resolution for Phase C.0: keep the OLD contiguous CRYPTO layout, but
# under the new name CRYPTO_RESIDENT, spanning the full $6000-$BFFF
# range (24 KB). No OVERLAY region is created yet — the OVERLAY_*
# segments below are declared `optional = yes` with `load =
# CRYPTO_RESIDENT` as a harmless placeholder so shared code that
# references the segment names still links. Phase C.1 will split
# CRYPTO_RESIDENT and introduce the real CRYPTO_OVERLAY region once the
# first sibling lib arrives with an actual overlay image.
#
# CPU port $01 is set to $36 at boot (BASIC ROM off), so $8000-$BFFF is
# plain RAM under what would otherwise be BASIC ROM shadow + the top of
# the character ROM gap.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_IP65:       start = $0002, size = $001A, type = rw, define = yes;
    ZP_CRYPTO:     start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:       start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:      start = $07FF, size = $0002, file = %O;
    LOADER:        start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    NET_CODE:      start = $2000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    NET_BSS:       start = $4000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO_RESIDENT: start = $6000, size = $6000, file = %O, define = yes, fill = yes, fillval = $00;

    # Phase C.0 placeholder: CRYPTO_OVERLAY is not yet a real region under
    # ip65 (see transitional note at top). A zero-size rw alias is declared
    # here only to satisfy `crypto_swap.s`'s `.import __CRYPTO_OVERLAY_START__`
    # — Phase C.0 never actually issues the DMA, so the address value is
    # unused. Phase C.1 will replace this with a real $6000-$7FFF region.
    CRYPTO_OVERLAY: start = $6000, size = $0000, type = rw, define = yes;

    TCP_BUF:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZP_SHARED:     load = ZP_IP65,        type = zp,  optional = yes;
    ZEROPAGE:      load = ZP_CRYPTO,      type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,        type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,       type = ro;
    EXEHDR:        load = LOADER,         type = ro;
    STARTUP:       load = LOADER,         type = ro,  optional = yes;
    CODE:          load = LOADER,         type = ro;
    RODATA:        load = CRYPTO_RESIDENT, type = ro;
    INIT:          load = LOADER,         type = ro,  optional = yes;

    NET_CODE:      load = NET_CODE,       type = ro;
    # LOADER-overflow rides along with the ip65 blob in the NET_CODE tail.
    LOADER_OVERFLOW: load = NET_CODE,     type = ro,  optional = yes;
    NET_BSS:       load = NET_BSS,        type = bss, optional = yes;

    # --- Overlay slot placeholders (Phase C.0 deferred). ---
    # Phase C.1 will redirect these to a real CRYPTO_OVERLAY region
    # once the first sibling lib ships an overlay image. Today nothing
    # in-tree emits into these segments, so `optional = yes` + the
    # CRYPTO_RESIDENT load anchor is a harmless no-op. See the
    # transitional note at the top of this file and the plan doc
    # /home/someone/.claude/plans/synchronous-baking-curry.md
    # ("Phase B final decision") for the target layout.
    OVERLAY_X25519: load = CRYPTO_RESIDENT, type = ro, optional = yes;
    OVERLAY_P256:   load = CRYPTO_RESIDENT, type = ro, optional = yes;
    OVERLAY_P384:   load = CRYPTO_RESIDENT, type = ro, optional = yes;

    # --- Resident crypto + TLS code / rodata. ---
    CRYPTO_CODE:   load = CRYPTO_RESIDENT, type = ro;
    CRYPTO_RODATA: load = CRYPTO_RESIDENT, type = ro;
    TLS_CODE:      load = CRYPTO_RESIDENT, type = ro;
    RESIDENT_RODATA: load = CRYPTO_RESIDENT, type = ro, optional = yes;

    # --- Resident BSS. Everything that used to live in SHADOW_BSS now
    # shares CRYPTO_RESIDENT; TABLES_BSS keeps page alignment.
    BSS:           load = CRYPTO_RESIDENT, type = bss;
    CRYPTO_BSS:    load = CRYPTO_RESIDENT, type = bss;
    TABLES_BSS:    load = CRYPTO_RESIDENT, type = bss, align = $100;

    TCP_RECV_BUF:  load = TCP_BUF,         type = bss, optional = yes;
}
