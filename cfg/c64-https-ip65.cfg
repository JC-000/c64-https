# c64-https ld65 config — ip65/RR-Net backend
#
# MEMORY map is load-bearing and derived from the ACME build:
#   $0801-$1FFF : LOADER (BASIC stub + boot + tls + http + net wrapper)
#   $2000-$3FFF : NET_CODE (ip65 code, delivered as .incbin blob for now)
#   $4000-$5FFF : NET_BSS (ip65 BSS, not written to file)
#   $6000-$9FFF : CRYPTO (all crypto code + tables, must stay below $A000)
#   $A000-$BFFF : SHADOW_BSS (mutable state behind BASIC ROM shadow, port=$36)
#   $C000-$CFFF : TCP_BUF (tcp_recv_buf, 4KB ring)

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_IP65:     start = $0002, size = $001A, type = rw, define = yes;
    ZP_CRYPTO:   start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:     start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:    start = $07FF, size = $0002, file = %O;
    LOADER:      start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    NET_CODE:    start = $2000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    NET_BSS:     start = $4000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO:      start = $6000, size = $4000, file = %O, define = yes, fill = yes, fillval = $00;

    SHADOW_BSS:  start = $A000, size = $2000, type = rw, define = yes;
    TCP_BUF:     start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZP_SHARED:     load = ZP_IP65,    type = zp,  optional = yes;
    ZEROPAGE:      load = ZP_CRYPTO,  type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,    type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,   type = ro;
    EXEHDR:        load = LOADER,     type = ro;
    STARTUP:       load = LOADER,     type = ro,  optional = yes;
    CODE:          load = LOADER,     type = ro;
    RODATA:        load = CRYPTO,     type = ro;
    INIT:          load = LOADER,     type = ro,  optional = yes;

    NET_CODE:      load = NET_CODE,   type = ro;
    NET_BSS:       load = NET_BSS,    type = bss, optional = yes;

    CRYPTO_CODE:   load = CRYPTO,     type = ro;
    CRYPTO_RODATA: load = CRYPTO,     type = ro;
    TLS_CODE:      load = CRYPTO,     type = ro;

    BSS:           load = SHADOW_BSS, type = bss;
    CRYPTO_BSS:    load = SHADOW_BSS, type = bss;
    TABLES_BSS:    load = CRYPTO,     type = bss, align = $100;

    TCP_RECV_BUF:  load = TCP_BUF,    type = bss, optional = yes;
}
