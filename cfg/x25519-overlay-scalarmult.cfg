# cfg/x25519-overlay-scalarmult.cfg -- ld65 config for the X25519
# scalarmult overlay .bin image (W3 library-ingestion architecture).
#
# Mirrors cfg/p256-overlay-verify.cfg + cfg/p384-overlay-{sha384,curve}.cfg.
# Produces a 7,680 B padded .bin image of the c64-x25519 sibling's code
# + rodata + bss, suitable for embedding via .incbin into the PRG
# (planned W1 wiring) or for documentation / CI artefact use.
#
# Today the X25519 sibling rodata + bss is linker-placed into
# CRYPTO_OVERLAY at PRG-load time under USE_X25519_SIBLING=1 (see
# cfg/c64-https-uci.cfg's X25519_RODATA / X25519_BSS segments).  This
# .bin is the same byte image in a standalone linker invocation -- a
# CI-friendly artefact that can be diffed against the in-PRG slot
# bytes for parity checking.
#
# Layout matches the live UCI CRYPTO_OVERLAY base ($4200) and size
# ($1E00 = 7,680 B / 7.5 KB) so the .bin DMAs into the live slot
# cleanly at harness time.

FEATURES {
    STARTADDRESS: default = $4200;
}

MEMORY {
    ZP:             start = $0022, size = $001E, type = rw, define = yes;
    OVERLAY_REGION: start = $4200, size = $1E00, file = %O, define = yes,
                    fill = yes, fillval = $00;
    RESIDENT:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE:               load = ZP,             type = zp,  optional = yes;

    # The sibling archive uses CRYPTO_CODE for code and
    # X25519_RODATA / X25519_BSS for its tables (set by
    # tools/integration/build_x25519.sh).  Route the code + rodata
    # into the overlay region so the .bin is the byte image the main
    # PRG's live slot will hold.  X25519_BSS is routed to RESIDENT
    # rather than OVERLAY_REGION: BSS bytes are zero-initialized at
    # runtime by reu_clear_wide / x25519_init, so the .bin doesn't
    # need them.  Including BSS in the overlay region overflows by
    # ~512 B (combined CRYPTO_CODE + X25519_RODATA + X25519_BSS just
    # barely doesn't fit at $1E00).
    CRYPTO_CODE:            load = OVERLAY_REGION, type = ro,  optional = yes;
    X25519_RODATA:          load = OVERLAY_REGION, type = ro,  optional = yes, align = $100;
    RODATA:                 load = OVERLAY_REGION, type = ro,  optional = yes;
    CODE:                   load = OVERLAY_REGION, type = ro,  optional = yes;

    # Resident RW buffers (none used by x25519 archive today) -- pinned
    # at $C000 just so any future symbol references resolve.
    X25519_BSS:             load = RESIDENT,       type = bss, optional = yes, align = $100;
    DATA:                   load = RESIDENT,       type = rw,  optional = yes;
    BSS:                    load = RESIDENT,       type = bss, optional = yes;
    CRYPTO_BSS:             load = RESIDENT,       type = bss, optional = yes;
    TABLES_BSS:             load = RESIDENT,       type = bss, optional = yes;
}
