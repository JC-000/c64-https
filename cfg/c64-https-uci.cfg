# c64-https ld65 config — UCI (Ultimate Command Interface) backend
#
# Target: Commodore Ultimate 64 / U64E using the host-visible UCI
# ($DF1B-$DF1F) in place of ip65 + RR-Net.
#
# Memory map (post-W1 partial — see comment block at the MEMORY block
# below for the fit constraints that forced this layout):
#   $0801-$1FFF : LOADER             (BASIC stub + boot + http + net wrapper)
#   $2000-$3B25 : NET_CODE           (UCI adapter + LOADER_OVERFLOW tail +
#                                     TLS_CODE + CRYPTO_AUX_CODE)
#   $3B26-$3FFF : NET_BSS_TAIL       (BSS spill-over reclaimed from the
#                                     NET_CODE tail — UCI_BSS +
#                                     LIB_NISTCURVES_P256_BSS land here)
#   $4000-$41FF : UCI_BSS_REGION     (zero-size alias post-W1; UCI_BSS
#                                     moved into NET_BSS_TAIL above)
#   $4200-$5FFF : CRYPTO_OVERLAY     (7.5 KB swappable overlay slot — used
#                                     by the X25519 sibling / P-384 overlay
#                                     / W3 P-256 overlay embed)
#   $6000-$BFFF : CRYPTO_HOT         (24 KB file-backed; always-resident
#                                     hot + warm + much of the cold path:
#                                     ChaCha20-Poly1305, SHA-256, HKDF/
#                                     HMAC-DRBG, TLS, HTTP, mul tables,
#                                     AEAD, transcript, libs/nistcurves
#                                     P-256 verify + most BSS. The W1 plan
#                                     wanted a 16 KB hot / 8 KB cold split
#                                     here but the bumped library does not
#                                     fit that partition — see comment
#                                     block at the MEMORY entry.)
#   $C000-$CFFF : TCP_BUF            (tcp_recv_buf, 4 KB ring)
#
# --- W1 hot/cold partition (post-bump library-ingestion architecture) ---
# Before: CRYPTO_RESIDENT was a single 24 KB file-backed region $6000-$BFFF
# carrying every byte of crypto code + rodata + BSS. CLAUDE.md recorded it
# as "100% full" after Phase 6; the libs/nistcurves cfa9085 bump (which
# adds ~768 B of new code via PR #34 + PR #26) would have overflowed it.
#
# The W1 split lets the file-backed region carry only what needs PRG-load
# byte initialization (code + rodata, $6000-$9FFF = 16 KB), and reclaims
# $A000-$BFFF as plain RAM under BASIC ROM banking for BSS that is
# zero-initialized at runtime anyway. This is the same "$01 = $36" RAM
# slice that pre-Phase-6 hosted the original SHADOW_BSS region; bringing
# it back as a dedicated BSS slot leaves room in CRYPTO_HOT for the
# nistcurves bump's additional code bytes.
#
# Library segments (under c64-lib-contract / libs/nistcurves cfa9085+):
#
#   LIB_NISTCURVES_P256_CODE   - fp256, mod256, points256_core, ecdsa256.
#                                 Default: CRYPTO_HOT (always-resident).
#                                 Under EMBED_P256_OVERLAY=1: routed via
#                                 OVERLAY_BLOB_P256 to the live overlay
#                                 slot at boot.
#   LIB_NISTCURVES_P256_RODATA - curve256, mod256 constants. CRYPTO_HOT.
#   LIB_NISTCURVES_P256_BSS    - data_p256 working buffers. CRYPTO_HOT BSS.
#   LIB_NISTCURVES_P384_*      - routed via the OVERLAY_P384_CURVE slot
#                                 (paged from REU bank 7 at handshake time).
#   LIB_NISTCURVES_SHA384_*    - routed via the OVERLAY_P384_SHA384 slot
#                                 (paged from REU bank 6 at handshake time).
#
# (For the W2 ip65-side restructure, see cfg/c64-https-ip65.cfg. ip65
# stays on the pre-W1 layout for now — out of scope here.)

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_CRYPTO:   start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:     start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:       start = $07FF, size = $0002, file = %O;
    LOADER:         start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    # W1 partial: NET_CODE shrunk to fit current content (~$1B26 = 6950 B
    # on branch tip), tail reclaimed as NET_BSS_TAIL to spill BSS that
    # does not fit in CRYPTO_HOT under the bumped libs/nistcurves. UCI_BSS
    # now shares NET_BSS_TAIL too (the dedicated UCI_BSS_REGION was 512 B
    # but only used ~$125 — folding it into NET_BSS_TAIL frees ~370 B
    # for the libs/nistcurves spill-over). ip65 has had an equivalent
    # NET_BSS_TAIL since Phase C.4 — UCI now adopts the same pattern.
    # Grown $40 (iface-fallback loop in net_dhcp_acquire, C64U WiFi
    # support) — donated from NET_BSS_TAIL, whose occupancy tops out at
    # $625 (LIB_NISTCURVES_P256_BSS) leaving $B5 slack pre-donation.
    NET_CODE:       start = $2000, size = $1B66, file = %O, define = yes, fill = yes, fillval = $00;
    # NET_BSS_TAIL spans NET_CODE end through the start of CRYPTO_OVERLAY,
    # subsuming the historical UCI_BSS_REGION at $4000-$41FF (UCI_BSS now
    # rides on the head of this combined region). Holds 1.7 KB total —
    # ld65 distributes UCI_BSS (~293 B) + LIB_NISTCURVES_P256_BSS (~1.5
    # KB) + a stub UCI_BSS_REGION definition.
    NET_BSS_TAIL:   start = $3B66, size = $069A, file = %O, define = yes, fill = yes, fillval = $00;
    # UCI_BSS_REGION kept as a zero-size alias so any external tooling
    # that resolves the symbol via labels.txt still finds it (the cfg's
    # `define = yes` emits __UCI_BSS_REGION_START__ etc.).
    UCI_BSS_REGION: start = $4000, size = $0000, type = rw, define = yes;
    CRYPTO_OVERLAY: start = $4200, size = $1E00, file = %O, define = yes, fill = yes, fillval = $00;

    # W1 HOT/COLD SPLIT (Worker I — root-cause fix for the
    # boot zero-fill regression):
    #
    # The W1 partial layout had CRYPTO_HOT spanning the full 24 KB
    # $6000-$BFFF as a single file-backed region. Under the bumped
    # libs/nistcurves, ld65 placed `LIB_NISTCURVES_P256_CODE` at
    # $868F-$A631 — *straddling $A000*. Boot (`src/boot.s` zbss loop)
    # zeros $A000-$BFFF as "SHADOW_BSS" zero-init, which wiped the
    # upper 1.5 KB of `ecdsa_verify_256`; the first call to verify
    # landed the CPU on `00 00 …` ⇒ BRK ⇒ KERNAL warm restart ⇒
    # BASIC READY ⇒ eternal hang during the TLS CertVerify step.
    #
    # The fix carves the region as originally intended:
    #
    #   CRYPTO_HOT          $6000-$9FFF  16 KB file-backed.
    #                                    Code + rodata + small BSS that
    #                                    do not need page alignment.
    #                                    No segment crosses $A000.
    #   CRYPTO_COLD_SHADOW  $A000-$BFFF   8 KB file-backed (zero-filled).
    #                                    Catch-all for the large BSS
    #                                    segments — wiped at boot by
    #                                    the zbss loop, which is benign
    #                                    because they are BSS anyway.
    #                                    File-backed (`fill = yes`) so
    #                                    the PRG stays contiguous on
    #                                    disk; the zero bytes are
    #                                    overwritten at runtime.
    #
    # See SEGMENTS{} below for the new routings (BSS / CRYPTO_BSS /
    # TABLES_BSS / BSS_TAIL → CRYPTO_COLD_SHADOW; small UCI_BSS stays
    # in CRYPTO_HOT). The 16 KB hot half fits the bumped library
    # comfortably; the 8 KB cold half has enough room for the four
    # largest BSS chunks routed there.
    CRYPTO_HOT:         start = $6000, size = $4000, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO_COLD_SHADOW: start = $A000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;

    # Phase 3: file-backed pad region from $C000-$DFFF.  ld65 emits
    # contiguous file output; the under-KERNAL OVERLAY_BLOB_CURVE_RAM
    # region at $E000-$FDFF requires the gap between CRYPTO_HOT/SHADOW
    # and $E000 to land in the file as zeros so KERNAL LOAD writes the
    # curve blob bytes to $E000 (not $C801).  $C000-$CFFF is TCP_BUF
    # at runtime (RAM, populated by ip65/UCI rx callback after net
    # init); the zero-fill PRG-load write is harmless because TCP_BUF
    # is zero-initialised at first use anyway.  $D000-$DFFF is I/O on
    # a real C64 + 1541 the PRG load WOULD momentarily corrupt VIC /
    # SID / CIA registers; production targets are VICE warp + U64
    # fastload, both of which inject bytes directly to RAM and bypass
    # CPU I/O writes during PRG load.
    OVERLAY_FILE_PAD: start = $C000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;

    # Phase 3: under-KERNAL ROM RAM at $E000-$FDFF holds the P-384
    # CURVE overlay blob (7,680 B) at PRG load time.  Boot DMAs it to
    # REU bank 7 then this region is reusable.  KERNAL LOAD writes
    # pass through to the underlying RAM regardless of $01 banking.
    OVERLAY_BLOB_CURVE_RAM: start = $E000, size = $1E00, file = %O, define = yes, fill = yes, fillval = $00;

    # NOTE: the historical TCP_BUF MEMORY region at $C000-$CFFF was
    # removed in Phase 3 -- the actual TCP rx ring is just the
    # `tcp_recv_buf = $c000` equate in src/constants.inc and the bytes
    # at runtime live inside OVERLAY_FILE_PAD's address range.  PRG
    # load zeros the ring; the rx callback overwrites it after net
    # init.  The optional TCP_RECV_BUF segment was also dropped from
    # SEGMENTS below (no .s file references the segment name; the
    # buffer is addressed via the equate, not via a segment label).
}

SEGMENTS {
    ZEROPAGE:      load = ZP_CRYPTO,      type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,        type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,       type = ro;
    EXEHDR:        load = LOADER,         type = ro;
    STARTUP:       load = LOADER,         type = ro,  optional = yes;
    CODE:          load = LOADER,         type = ro;
    # W4: http.s body-state / chunked-transfer parser. Rides LOADER
    # here (588 B free pre-W4); under ip65 LOADER is packed so the
    # segment maps to CRYPTO_OVERLAY there instead.
    HTTP_AUX_CODE: load = LOADER,         type = ro,  optional = yes;
    RODATA:        load = CRYPTO_HOT,     type = ro;
    INIT:          load = LOADER,         type = ro,  optional = yes;

    # NET_CODE hosts the UCI adapter + the LOADER_OVERFLOW tail.
    # Phase C.2 (UCI only): TLS_CODE and CRYPTO_AUX_CODE (SHA-256,
    # HMAC-DRBG, ecdsa_verify dispatcher) are relocated here as well
    # to open headroom in CRYPTO_HOT. The UCI adapter is ~1.7 KB
    # so NET_CODE has ~6.3 KB free after UCI_CODE + LOADER_OVERFLOW;
    # TLS_CODE ~1.8 KB + CRYPTO_AUX_CODE ~3 KB fits with room to spare.
    NET_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    UCI_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    LOADER_OVERFLOW: load = NET_CODE,     type = ro,  optional = yes;
    TLS_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    CRYPTO_AUX_CODE: load = NET_CODE,     type = ro,  optional = yes;
    # Phase C.4: hmac_drbg.s moved to CRYPTO_AUX_CODE2 so the ip65 cfg
    # can split it off into NET_CODE while sha256 stays in NET_BSS_TAIL.
    # Under UCI both segments flow into NET_CODE identically.
    CRYPTO_AUX_CODE2: load = NET_CODE,    type = ro,  optional = yes;
    # UCI_BSS (~293 B) is small and stays in CRYPTO_HOT (16 KB slot
    # has room for it alongside code + rodata; keeping it here saves
    # space in the 8 KB CRYPTO_COLD_SHADOW for the larger BSS chunks).
    UCI_BSS:       load = CRYPTO_HOT,    type = bss, optional = yes;
    # NET_BSS_TAIL is the spill-over BSS region carved from the
    # NET_CODE tail. Under the W1 hot/cold split (Worker I) it is
    # mostly freed: LIB_NISTCURVES_P256_BSS no longer rides here
    # (it moved to CRYPTO_COLD_SHADOW), so this region is effectively
    # available for harness scratch. The segment declaration stays
    # for any future BSS routing or harness use.
    NET_BSS_TAIL:  load = NET_BSS_TAIL,  type = bss, optional = yes;
    # BSS_TAIL hosts the largest c64-https in-tree BSS buffers
    # (tls_rec_buf 548 B; cert_buf moved to CERT_BUF_BSS below). Routed
    # to CRYPTO_COLD_SHADOW ($A000-$BFFF) under the hot/cold split.
    # ip65 refit: cert_buf moved from BSS_TAIL into its own segment so
    # the ip65 cfg can pin + union it with the lib verify scratch (see
    # cfg/c64-https-ip65.cfg SCRATCH_UNION). Under UCI it used to pack
    # first in the cold shadow; the Wikipedia growth (CERT_BUF_SIZE
    # 1536 -> 2048, src/net/uci/net_tuning.inc) moved it to
    # CRYPTO_OVERLAY — see the overlay-slot block below.
    BSS_TAIL:      load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;

    # --- Overlay slot. ---
    # The P-256 / P-384 OVERLAY segments are declared so ld65 has a
    # valid load address even when nothing is currently linked. The
    # production PRG does not always embed an overlay image; under
    # EMBED_P256_OVERLAY=1 the P-256 .bin is .incbin'd via
    # OVERLAY_BLOB_P256; under USE_OVERLAY_P384_EMBED=1 the P-384 split
    # blobs ride OVERLAY_BLOB_SHA384.
    OVERLAY_P256:   load = CRYPTO_OVERLAY, type = ro, optional = yes;
    OVERLAY_P384:   load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # W1 streaming handshake-message deframer (src/tls_deframe.s,
    # TLS_STREAM_DEFRAME builds — default under BACKEND=uci). Routed to
    # CRYPTO_OVERLAY because CRYPTO_HOT cannot absorb its ~700 B under
    # the REU-profile archive. Resident code: mutually exclusive at
    # runtime with the overlay-embed flags that page images into this
    # region (EMBED_P256_OVERLAY / USE_OVERLAY_P384_EMBED), exactly as
    # LIB_NISTCURVES_MUL_CODE already is under the onchip profile.
    TLS_DEFRAME_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # cert_buf (src/der_decode.s), grown to 2048 B under UCI so
    # en.wikipedia.org's 1636 B leaf fits (CERT_BUF_SIZE in
    # src/net/uci/net_tuning.inc). Moved out of CRYPTO_COLD_SHADOW,
    # which had no room for the extra 512 B; CRYPTO_OVERLAY does.
    # This tightens the overlay contention: TLS_DEFRAME_CODE +
    # CERT_BUF_BSS are resident in every default UCI build, so the
    # mutually-exclusive overlay-embed flags (EMBED_P256_OVERLAY /
    # USE_OVERLAY_P384_EMBED / USE_X25519_SIBLING) now have ~2 KB less
    # to work with — check the .map before re-enabling any of them.
    CERT_BUF_BSS:  load = CRYPTO_OVERLAY, type = bss, optional = yes;

    # Phase C.5: sibling c64-x25519 rodata tables (mul38, sqr_lo/hi,
    # a24_b0..b3 — ~2 KB) AND the sibling's page-aligned BSS buffers
    # (fe25519_tmp1..4, x25_*, mul_dma_lo/hi/carry — ~1.5 KB) ride
    # CRYPTO_OVERLAY under UCI to keep CRYPTO_HOT inside its budget.
    # CRYPTO_OVERLAY is otherwise unused in the production UCI build
    # unless an overlay-embed flag is set (mutually exclusive across
    # USE_X25519_SIBLING / EMBED_P256_OVERLAY / USE_OVERLAY_P384_EMBED).
    # align = $100 so the .align 256 directives in
    # data_x25519_{rodata,bss}_raw.s land on real page boundaries.
    X25519_RODATA:  load = CRYPTO_OVERLAY, type = ro,  optional = yes, align = $100;
    X25519_BSS:     load = CRYPTO_OVERLAY, type = bss, optional = yes, align = $100;

    # --- Resident crypto + TLS code / rodata. ---
    CRYPTO_CODE:     load = CRYPTO_HOT,   type = ro;
    CRYPTO_RODATA:   load = CRYPTO_HOT,   type = ro;
    RESIDENT_RODATA: load = CRYPTO_HOT,   type = ro, optional = yes;
    CRYPTO_INIT_CODE: load = CRYPTO_HOT,  type = ro, optional = yes;

    # --- W5: libs/nistcurves segments (c64-lib-contract SPEC §4). ---
    # Under the default flag set (EMBED_P256_OVERLAY=0), the P-256
    # verify primitives are always-resident in CRYPTO_HOT — mirrors
    # the pre-restructure behavior. Under EMBED_P256_OVERLAY=1 they
    # ride the overlay slot; the segment definitions below stay
    # routed to CRYPTO_HOT because the embed path operates on a .bin
    # image (built by tools/integration/build_nistcurves_p256_bin.sh
    # from this same archive), not by re-routing the segments at
    # link time.
    LIB_NISTCURVES_P256_CODE:   load = CRYPTO_HOT, type = ro, optional = yes;
    LIB_NISTCURVES_P256_RODATA: load = CRYPTO_HOT, type = ro, optional = yes;
    # P-256 BSS is ~1.5 KB (fp256/mod256/points256 scratch + ecdsa256
    # input/output staging + data_p256 working buffers). Stays in
    # NET_BSS_TAIL under the W1 hot/cold split — CRYPTO_COLD_SHADOW
    # is full carrying the in-tree BSS chunks (BSS / CRYPTO_BSS /
    # TABLES_BSS / BSS_TAIL = ~8.1 KB out of the 8 KB budget once
    # TABLES_BSS page-alignment is accounted for). NET_BSS_TAIL has
    # ~185 B slack after the P-256 claim — adequate for harness use
    # via the candidate-fallback path in tools/uci/_memory_policy.py.
    LIB_NISTCURVES_P256_BSS:    load = NET_BSS_TAIL, type = bss, optional = yes;
    # The P-256 archive does not include data_shared.o or mul_8x8.o
    # (c64-https provides those — see tools/integration/build_nistcurves_p256.sh),
    # so the LIB_NISTCURVES_BSS / _TABLES / _MUL_CODE segments are
    # declared `optional = yes` for forward compatibility but receive
    # zero bytes today.
    LIB_NISTCURVES_BSS:         load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    LIB_NISTCURVES_TABLES:      load = CRYPTO_COLD_SHADOW, type = bss, optional = yes, align = $100;
    # Onchip profile (issue #69): og_common + sqtab equates. Placed in
    # CRYPTO_OVERLAY (free under USE_NISTCURVES_ONCHIP — the Makefile
    # forbids combining it with the P-384/P-256 overlay flags, whose
    # runtime swap-ins would clobber resident code here) because the
    # onchip fp256 growth overflows CRYPTO_HOT by ~59 B otherwise.
    LIB_NISTCURVES_MUL_CODE:    load = CRYPTO_OVERLAY, type = ro, optional = yes;
    # libs/nistcurves P-384 segments — routed via the OVERLAY_P384_CURVE
    # bin staging (DMA'd to REU bank 7 at boot, paged into the live
    # overlay slot on a P-384 handshake). Mirrors the pre-contract
    # OVERLAY_P384_CURVE segment name in the old build_nistcurves_p384.sh
    # output. The library now emits the new names natively.
    LIB_NISTCURVES_P384_CODE:        load = CRYPTO_OVERLAY, type = ro, optional = yes;
    LIB_NISTCURVES_P384_RODATA:      load = CRYPTO_OVERLAY, type = ro, optional = yes;
    LIB_NISTCURVES_P384_BSS:         load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    LIB_NISTCURVES_P384_DATA_BSS:    load = CRYPTO_COLD_SHADOW, type = rw, optional = yes;
    # libs/nistcurves SHA-384 segments — routed via the OVERLAY_P384_SHA384
    # bin staging (DMA'd to REU bank 6 at boot).
    LIB_NISTCURVES_SHA384_CODE:    load = CRYPTO_OVERLAY, type = ro, optional = yes;
    LIB_NISTCURVES_SHA384_RODATA:  load = CRYPTO_OVERLAY, type = ro, optional = yes;
    LIB_NISTCURVES_SHA384_TABLES:  load = CRYPTO_OVERLAY, type = ro, optional = yes, align = $100;
    LIB_NISTCURVES_SHA384_BSS:     load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;

    # --- Resident BSS — routed to CRYPTO_COLD_SHADOW under the W1
    # hot/cold split (Worker I). The BSS / CRYPTO_BSS segments are
    # the catch-all for in-tree c64-https state declarations
    # (src/data.s); landing them in the $A000-$BFFF banked-on RAM
    # slice frees the 16 KB CRYPTO_HOT region for code + rodata
    # (which MUST stay below $A000 because boot zeros that span as
    # zero-init BSS).
    BSS:           load = CRYPTO_COLD_SHADOW, type = bss;
    CRYPTO_BSS:    load = CRYPTO_COLD_SHADOW, type = bss;
    # TABLES_BSS pins the 1.5 KB sqtab/mul_dma tables on a page
    # boundary. Page alignment is load-bearing for the no-page-penalty
    # `lda abs,Y` addressing in the hot-path multiply routines.
    # start = $BA00 (page-aligned, so the .align 256 requirement is
    # still met): the sibling nistcurves archive reads the shared
    # quarter-square table through equates BAKED to
    # LIB_SHARED_SQTAB_BASE = $BC00 (sqtab_lo at TABLES_BSS+$200), and
    # the Makefile's post-link check asserts it. That address used to
    # fall out of cert_buf packing first in the cold shadow; with
    # CERT_BUF_BSS moved to CRYPTO_OVERLAY (Wikipedia growth) the
    # anchor must be explicit. $BA00 + $600 = $C000 — flush to the
    # region end, exactly the historical placement.
    TABLES_BSS:    load = CRYPTO_COLD_SHADOW, type = bss, start = $BA00;

    # Phase 3: P-384 split overlay blobs embedded in the PRG.  Boot
    # DMAs them out to REU banks 6/7 then the staging RAM is free.
    # Both segments are `optional = yes` so that builds without the
    # .bin files (e.g. before make p384-overlay has run) still link;
    # in that case the segments are empty and boot's reu_p384_overlay_init
    # DMAs zero bytes.  The .ifndef USE_X25519_SIBLING guard inside
    # src/crypto/shared/p384_overlay_blobs.s keeps the segments empty
    # under the sibling flag (CRYPTO_OVERLAY is taken by X25519_RODATA
    # in that build).
    OVERLAY_BLOB_SHA384: load = CRYPTO_OVERLAY,         type = ro, optional = yes;
    OVERLAY_BLOB_CURVE:  load = OVERLAY_BLOB_CURVE_RAM, type = ro, optional = yes;

    # W3: P-256 verify overlay blob.  Optional / off by default; embedded
    # when the Makefile flag EMBED_P256_OVERLAY=1 is set (which causes
    # src/crypto/shared/p256_overlay_blobs.s to .incbin the .bin file
    # under USE_OVERLAY_P256_EMBED).  Shares the CRYPTO_OVERLAY slot
    # with OVERLAY_BLOB_SHA384 at PRG-load time -- mutually exclusive:
    # the Makefile disables P-384 SHA embedding when EMBED_P256_OVERLAY=1.
    OVERLAY_BLOB_P256:   load = CRYPTO_OVERLAY,         type = ro, optional = yes;
}
