# c64-https ld65 config — UCI (Ultimate Command Interface) backend
#
# Target: Commodore Ultimate 64 / U64E using the host-visible UCI
# ($DF1B-$DF1F) in place of ip65 + RR-Net.
#
# Memory map (post-W1 partial — see comment block at the MEMORY block
# below for the fit constraints that forced this layout):
#   $0801-$1FFF : LOADER             (BASIC stub + boot + http + net wrapper)
#   $2000-$3B65 : NET_CODE           (UCI adapter + LOADER_OVERFLOW tail +
#                                     TLS_CODE + CRYPTO_AUX_CODE)
#   $3B66-$41FF : NET_BSS_TAIL       (BSS spill-over reclaimed from the
#                                     NET_CODE tail — the NET_BSS_TAIL
#                                     segment, i.e. deframer + viewer BSS.
#                                     LIB_NISTCURVES_P256_BSS is NOT here:
#                                     it shares cert_buf, see
#                                     P256_SCRATCH_UNION. NOT
#                                     UCI_BSS, which is in CRYPTO_HOT, and
#                                     NOT BSS_TAIL, which is in
#                                     CRYPTO_COLD_SHADOW)
#   $4000        : UCI_BSS_REGION    (zero-size alias post-W1; kept only so
#                                     `define = yes` still exports it)
#   $4200-$5FFF : CRYPTO_OVERLAY     (7.5 KB of resident RAM; the name is
#                                     historical — the runtime overlay swap
#                                     was retired with P-384)
#   $6000-$9FFF : CRYPTO_HOT         (16 KB file-backed; resident code +
#                                     rodata + small BSS: ChaCha20-Poly1305,
#                                     SHA-256, HKDF/HMAC-DRBG, TLS, HTTP,
#                                     mul tables, AEAD, transcript,
#                                     libs/nistcurves P-256 verify, UCI_BSS)
#   $A000-$BFFF : CRYPTO_COLD_SHADOW (8 KB of RAM under the BASIC ROM,
#                                     $01=$36; the large zero-init BSS —
#                                     BSS / CRYPTO_BSS / BSS_TAIL, and
#                                     TABLES_BSS pinned at $BA00)
#   $C000-$CFFF : TCP ring           (tcp_recv_buf, 4 KB, by equate in
#                                     src/constants.inc; RAM, no region)
#   $D000-$DFFF : I/O                (never in the PRG: a KERNAL LOAD
#                                     would write the registers, #288)
#
# The W1 hot/cold split below DID happen: the note that used to stand here
# saying the bumped library "does not fit that partition" described an
# earlier single 24 KB CRYPTO_HOT and was left behind by the change.
#
# --- W1 hot/cold partition (post-bump library-ingestion architecture) ---
# Before: CRYPTO_RESIDENT was a single 24 KB file-backed region $6000-$BFFF
# carrying every byte of crypto code + rodata + BSS. CLAUDE.md recorded it
# as "100% full" after Phase 6; the libs/nistcurves cfa9085 bump (which
# adds ~768 B of new code via PR #34 + PR #26) would have overflowed it.
#
# The W1 split lets the file-backed region carry only what needs PRG-load
# byte initialization (code + rodata, $6000-$9FFF = 16 KB), and reclaims
# $A000-$BFFF as plain RAM under BASIC ROM banking for BSS that is
# zero-initialized at runtime anyway. This is the same "$01 = $36" RAM
# slice that pre-Phase-6 hosted the original SHADOW_BSS region; bringing
# it back as a dedicated BSS slot leaves room in CRYPTO_HOT for the
# nistcurves bump's additional code bytes.
#
# Library segments (under c64-lib-contract / libs/nistcurves cfa9085+):
#
#   LIB_NISTCURVES_P256_CODE   - fp256, mod256, points256_core, ecdsa256.
#                                 CRYPTO_HOT (always-resident).
#   LIB_NISTCURVES_P256_RODATA - curve256, mod256 constants. CRYPTO_OVERLAY
#                                 from the v0.14.0 pin (was CRYPTO_HOT) —
#                                 see the routing line near the bottom.
#   LIB_NISTCURVES_P256_BSS    - data_p256 working buffers. On cert_buf
#                                 (P256_SCRATCH_UNION, MEMORY block): the
#                                 two lifetimes are disjoint — see the
#                                 routing line near the bottom of this file.
#
# (For the W2 ip65-side restructure, see cfg/c64-https-ip65.cfg. ip65
# stays on the pre-W1 layout for now — out of scope here.)

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_CRYPTO:   start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:     start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:       start = $07FF, size = $0002, file = %O, define = yes;
    LOADER:         start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    # W1 partial: NET_CODE sized to fit its content, and its tail reclaimed
    # as NET_BSS_TAIL to spill BSS that does not fit in CRYPTO_HOT under the
    # bumped libs/nistcurves. ip65 has had an equivalent NET_BSS_TAIL since
    # Phase C.4; UCI adopted the same pattern here. NET_CODE was later grown
    # by $40 (iface-fallback loop in net_dhcp_acquire, C64U WiFi support),
    # donated from NET_BSS_TAIL.
    #
    # The `size =` on the next line is the authority for the region's extent
    # and the header map at the top of this file is derived from it. Earlier
    # revisions of this comment restated it in prose ("~$1B26 = 6950 B") and
    # went stale against the line they sat above; do not reintroduce that.
    NET_CODE:       start = $2000, size = $1B66, file = %O, define = yes, fill = yes, fillval = $00;
    # NET_BSS_TAIL spans NET_CODE end through the start of CRYPTO_OVERLAY,
    # subsuming the span of the historical UCI_BSS_REGION at $4000-$41FF:
    # that region was collapsed to the zero-size alias below and its 512 B
    # handed to NET_BSS_TAIL, of which only ~$125 had ever been used.
    #
    # It holds the NET_BSS_TAIL segment (deframer + viewer BSS) and the
    # stub UCI_BSS_REGION. The sibling's LIB_NISTCURVES_P256_BSS used to
    # pack here too; it now shares cert_buf (P256_SCRATCH_UNION, below).
    # It does **NOT** hold UCI_BSS. UCI_BSS is routed to CRYPTO_HOT by the
    # SEGMENTS block below, and both shipped UCI products link it there
    # (measured 2026-08-31, build/c64-https.map). The header map at the top
    # of this file says the same thing; if the two ever disagree again, the
    # segment line and the map file win over any comment.
    #
    # For occupancy run tools/measure_margins.py, not a figure written here.
    NET_BSS_TAIL:   start = $3B66, size = $069A, file = %O, define = yes, fill = yes, fillval = $00;
    # UCI_BSS_REGION kept as a zero-size alias so any external tooling
    # that resolves the symbol via labels.txt still finds it (the cfg's
    # `define = yes` emits __UCI_BSS_REGION_START__ etc.).
    UCI_BSS_REGION: start = $4000, size = $0000, type = rw, define = yes;
    CRYPTO_OVERLAY: start = $4200, size = $1E00, file = %O, define = yes, fill = yes, fillval = $00;
    # P256_SCRATCH_UNION: LIB_NISTCURVES_P256_BSS (verify scratch) on top
    # of cert_buf, which is pinned at the head of CRYPTO_OVERLAY — the UCI
    # twin of cfg/c64-https-ip65.cfg's SCRATCH_UNION (#68). Disjoint
    # lifetimes: the LIFETIME CONTRACT at CERT_BUF_BSS in src/der_decode.s.
    # The size is CERT_BUF_SIZE (src/net/uci/net_tuning.inc), so P-256 BSS
    # growth past cert_buf is a link error, not a silent overlap with the
    # next CRYPTO_OVERLAY tenant; src/der_decode.s asserts start and size.
    # Not file-backed: the bytes are cert_buf's.
    P256_SCRATCH_UNION: start = $4200, size = $0800, type = rw, define = yes;

    # W1 HOT/COLD SPLIT (Worker I — root-cause fix for the
    # boot zero-fill regression):
    #
    # The W1 partial layout had CRYPTO_HOT spanning the full 24 KB
    # $6000-$BFFF as a single file-backed region. Under the bumped
    # libs/nistcurves, ld65 placed `LIB_NISTCURVES_P256_CODE` at
    # $868F-$A631 — *straddling $A000*. Boot (`src/boot.s` zbss loop)
    # zeros $A000-$BFFF as "SHADOW_BSS" zero-init, which wiped the
    # upper 1.5 KB of `ecdsa_verify_256`; the first call to verify
    # landed the CPU on `00 00 …` ⇒ BRK ⇒ KERNAL warm restart ⇒
    # BASIC READY ⇒ eternal hang during the TLS CertVerify step.
    #
    # The fix carves the region as originally intended:
    #
    #   CRYPTO_HOT          $6000-$9FFF  16 KB file-backed.
    #                                    Code + rodata + small BSS that
    #                                    do not need page alignment.
    #                                    No segment crosses $A000.
    #   CRYPTO_COLD_SHADOW  $A000-$BFFF   8 KB file-backed (zero-filled).
    #                                    Catch-all for the large BSS
    #                                    segments — wiped at boot by
    #                                    the zbss loop, which is benign
    #                                    because they are BSS anyway.
    #                                    File-backed (`fill = yes`) so
    #                                    the PRG stays contiguous on
    #                                    disk; the zero bytes are
    #                                    overwritten at runtime.
    #
    # See SEGMENTS{} below for the new routings (BSS / CRYPTO_BSS /
    # TABLES_BSS / BSS_TAIL → CRYPTO_COLD_SHADOW; small UCI_BSS stays
    # in CRYPTO_HOT). The 16 KB hot half fits the bumped library
    # comfortably; the 8 KB cold half has enough room for the four
    # largest BSS chunks routed there.
    CRYPTO_HOT:         start = $6000, size = $4000, file = %O, define = yes, fill = yes, fillval = $00;
    # PQ_HYBRID (libs/mlkem): the shadow's FILE bytes and its RAM bytes are
    # two areas over the same $A000-$BFFF. CRYPTO_COLD_SHADOW is the RAM
    # view every BSS segment is placed in (unchanged names, symbols and
    # addresses); COLD_FILE is the file view, a zero-filled 8 KB image that
    # is byte-for-byte what CRYPTO_COLD_SHADOW alone used to emit. With no
    # staged segment the PRG is identical to before. The ML-KEM code+rodata
    # LOADS here (the file bytes under the BSS exist anyway: boot zeroes
    # them) and RUNS at $E000, copied by boot before the zeroing. A BSS
    # segment cannot share an area with a ro one at the same addresses, which
    # is why the two views are separate areas rather than one.
    CRYPTO_COLD_SHADOW: start = $A000, size = $2000, type = rw, file = "", define = yes;
    COLD_FILE:          start = $A000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    # X25519_SCRATCH overlaps tls_rec_buf (BSS_TAIL, 548 B) ON PURPOSE
    # (issue #245). It carries the X25519 sibling's 17 field buffers
    # (X25519_BSS, 544 B), which are live only inside the two scalar mults
    # in src/tls_ecdh.s. tls_rec_buf is dead across both: the keygen runs
    # at tls_connect entry before any record is read, and tls13.s folds
    # the ServerHello record into the transcript BEFORE the shared-secret
    # mult, after which the next record read overwrites it. The size cap
    # is tls_rec_buf's span, so growth is an ld65 overflow; the start is
    # asserted equal to tls_rec_buf in src/crypto/x25519_tables.s.
    X25519_SCRATCH:     start = $A000, size = $0224, type = rw, define = yes;

    # PQ_HYBRID=1 only (libs/mlkem, X25519MLKEM768; see PQ_HYBRID in the
    # Makefile and src/crypto/mlkem_link.s, which asserts every number
    # here). All three are file="": no PRG byte is spent on them, and with no
    # LIB_MLKEM_* segment linked they are empty, so an unset build is
    # byte-identical.
    #   MLKEM_CODE_RAM  $E000-$FDFF, RAM under the KERNAL ROM (callers run
    #                   ML-KEM with the KERNAL banked out, under sei). Not
    #                   file-backed (#288: no PRG byte may reach $D000+): the
    #                   code LOADS in COLD_FILE at $A000 and boot copies it up.
    #   MLKEM_BSS_RAM   $B100-$BBFF = X25519_TABLES + the $B900 hole +
    #                   mul_dma_lo/hi, all dead while ML-KEM runs (ML-KEM
    #                   never interleaves with X25519 or fp_mul).
    #   MLKEM_POLY_RAM  $D000-$DFFF, RAM under I/O ($01 banked to all-RAM).
    MLKEM_CODE_RAM:     start = $E000, size = $1E00, type = rw, file = "", define = yes;
    MLKEM_BSS_RAM:      start = $B100, size = $0B00, type = rw, file = "", define = yes;
    MLKEM_POLY_RAM:     start = $D000, size = $1000, type = rw, file = "", define = yes;

    # The PRG ends at $BFFF, CRYPTO_COLD_SHADOW's last byte (#288).
    # Nothing above it is file-backed. A zero pad used to run on to $DFFF
    # (it put the retired P-384 curve blob at $E000), so a KERNAL LOAD
    # wrote zeros into the VIC/SID/CIA registers at $D000-$DFFF;
    # tools/test_prg_io_range.py fails if a PRG reaches $D000 again.
    # The TCP rx ring is the `tcp_recv_buf = $c000` equate in
    # src/constants.inc, not a region: net_tcp_connect empties it
    # (head = tail = 0) and nothing reads a byte net_poll did not write,
    # so what the load left there never mattered.
}

# --- Region occupancy -------------------------------------------------------
#
# Free bytes per region are measured, never written here: they differ per
# profile and every hand-kept copy drifted. `python3 tools/measure_margins.py`
# reads build/c64-https.map against this file's MEMORY block (`--build` does
# all profiles). Harness scratch comes from tools/uci/_memory_policy.py
# (build/labels.txt), never from a margin figure.
# ---------------------------------------------------------------------------

SEGMENTS {
    ZEROPAGE:      load = ZP_CRYPTO,      type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,        type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,       type = ro;
    EXEHDR:        load = LOADER,         type = ro;
    STARTUP:       load = LOADER,         type = ro,  optional = yes;
    CODE:          load = LOADER,         type = ro;
    # W4: http.s body-state / chunked-transfer parser. Rides LOADER
    # here because this backend's LOADER has room and ip65's does not
    # (there the segment maps to CRYPTO_OVERLAY instead).
    HTTP_AUX_CODE: load = LOADER,         type = ro,  optional = yes;
    # x25_basepoint + fe_p (libs/x25519, #245). Ahead of RODATA so its
    # 32-byte alignment lands on the region start and costs no fill.
    X25519_RODATA: load = CRYPTO_HOT, type = ro, align = $20;
    RODATA:        load = CRYPTO_HOT,     type = ro;
    INIT:          load = LOADER,         type = ro,  optional = yes;
    # cert_buf first, at a fixed address, so the areas that time-share it
    # can sit on it: P256_SCRATCH_UNION (src/der_decode.s asserts it does)
    # and, on the cold cfg, the COLD_RUN_* areas (src/net/uci/cold_bank.s).
    CERT_BUF_BSS:  load = CRYPTO_OVERLAY, type = bss, start = $4200;
    # W4 REU body sink (src/http.s HTTP_SINK_CODE, BACKEND=uci only).
    # Rides CRYPTO_OVERLAY alongside the deframer/cert_buf/viewer
    # residents.
    HTTP_SINK_CODE:  load = CRYPTO_OVERLAY, type = ro, optional = yes;
    # The sink's REU-region guard (src/http.s: reu_probe_size, sink_fits):
    # resident, CRYPTO_HOT has the room CRYPTO_OVERLAY and LOADER lack.
    HTTP_SINK_GUARD: load = CRYPTO_HOT,     type = ro, optional = yes;
    # jsr-only helper slice split out of HTTP_AUX_CODE for ip65's sake
    # (see c64-https-ip65.cfg); under UCI it shares CRYPTO_OVERLAY.
    HTTP_AUX_CODE2:  load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # NET_CODE hosts the UCI adapter + the LOADER_OVERFLOW tail.
    # Phase C.2 (UCI only): TLS_CODE and CRYPTO_AUX_CODE (SHA-256,
    # HMAC-DRBG, ecdsa_verify dispatcher) are relocated here as well
    # to open headroom in CRYPTO_HOT. #149 overflowed this region by
    # 35 B and cost the UCI backend entirely, so treat it as full and
    # run tools/measure_margins.py before adding anything.
    NET_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    UCI_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    LOADER_OVERFLOW: load = NET_CODE,     type = ro,  optional = yes;
    LOADER_OVERFLOW_TS: load = NET_CODE,  type = ro,  optional = yes;   # TRUST_STORE=1 (src/loader_overflow.inc)
    TLS_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    CRYPTO_AUX_CODE: load = NET_CODE,     type = ro,  optional = yes;
    # Phase C.4: hmac_drbg.s moved to CRYPTO_AUX_CODE2 so the ip65 cfg
    # can split it off into NET_CODE while sha256 stays in NET_BSS_TAIL.
    # Under UCI both segments flow into NET_CODE identically.
    CRYPTO_AUX_CODE2: load = NET_CODE,    type = ro,  optional = yes;
    # UCI_BSS is small — a few hundred bytes; read build/c64-https.map for
    # the figure — and stays in CRYPTO_HOT (the 16 KB slot has room for it
    # alongside code + rodata, and keeping it here saves space in the 8 KB
    # CRYPTO_COLD_SHADOW for the larger BSS chunks). This routing is the
    # one the MEMORY block's NET_BSS_TAIL comment defers to.
    UCI_BSS:       load = CRYPTO_HOT,    type = bss, optional = yes;
    # NET_BSS_TAIL is the spill-over BSS region carved from the
    # NET_CODE tail. The NET_BSS_TAIL segment carries the deframer +
    # viewer BSS; LIB_NISTCURVES_P256_BSS no longer packs after it (it
    # shares cert_buf, see the segment near the bottom of this file),
    # so most of the region is free. The harness must take scratch addresses
    # from tools/uci/_memory_policy.py, which parses build/labels.txt,
    # not from any figure written here.
    NET_BSS_TAIL:  load = NET_BSS_TAIL,  type = bss, optional = yes;
    # BSS_TAIL hosts the largest c64-https in-tree BSS buffers
    # (tls_rec_buf 548 B; cert_buf moved to CERT_BUF_BSS below). Routed
    # to CRYPTO_COLD_SHADOW ($A000-$BFFF) under the hot/cold split.
    # ip65 refit: cert_buf moved from BSS_TAIL into its own segment so
    # the ip65 cfg can pin + union it with the lib verify scratch (see
    # cfg/c64-https-ip65.cfg SCRATCH_UNION). Under UCI it used to pack
    # first in the cold shadow; the Wikipedia growth (CERT_BUF_SIZE
    # 1536 -> 2048, src/net/uci/net_tuning.inc) moved it to
    # CRYPTO_OVERLAY — see the overlay-slot block below.
    BSS_TAIL:      load = CRYPTO_COLD_SHADOW, type = bss, optional = yes, start = $A000;

    # W1 streaming handshake-message deframer (src/tls_deframe.s,
    # TLS_STREAM_DEFRAME builds — default under BACKEND=uci). Routed to
    # CRYPTO_OVERLAY because CRYPTO_HOT cannot absorb its ~700 B under
    # the REU-profile archive. Resident code, like everything here: the
    # runtime overlay swap that once paged images into this region was
    # retired with P-384.
    TLS_DEFRAME_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # cert_buf (src/der_decode.s), grown to 2048 B under UCI so
    # en.wikipedia.org's 1636 B leaf fits (CERT_BUF_SIZE in
    # src/net/uci/net_tuning.inc). Moved out of CRYPTO_COLD_SHADOW,
    # which had no room for the extra 512 B; CRYPTO_OVERLAY does.
    # (CERT_BUF_BSS is pinned at the head of the region, above)


    # Lane G stretch goal: REU-backed text viewer (src/viewer.s). Rides
    # CRYPTO_OVERLAY here because CRYPTO_HOT under this cfg cannot take
    # its ~1.2 KB (the -onchip.cfg comb variant moves the rodata out of
    # CRYPTO_HOT and so can place it there instead). The
    # overlay slot has room for it in the shipped non-comb UCI profiles.
    VIEWER_CODE:    load = CRYPTO_OVERLAY, type = ro,  optional = yes;

    # Issue #135: server name validation (src/x509_name.s, 491 B). Rides
    # CRYPTO_OVERLAY for the same reason VIEWER_CODE does: CRYPTO_HOT does
    # not have 491 B to give.
    # Not declared in the ip65 cfg:
    # that backend compiles the routine out entirely (see the Makefile).
    X509_NAME_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # Issue #126: the HTTPS_HOST / HTTPS_PATH / HTTPS_SNI strings, whose
    # SIZE is a build knob. They used to ride RODATA into CRYPTO_HOT, which
    # is nearly full, so `make
    # HTTPS_HOST=en.wikipedia.org HTTPS_PATH=/w/index.php?...` overflowed
    # the region by 34 B and failed the link on LIB_NISTCURVES_P256_RODATA
    # — a segment with nothing to do with the knob. CRYPTO_OVERLAY has the
    # larger tail of the two under BOTH shipped UCI profiles, so the knob's
    # cost lands in the roomier of the two. Under comb that is still
    # not enough for the 63/100/63-char maxima in src/boot.s: a host + path
    # at maximum overflows CRYPTO_OVERLAY.
    HTTPS_TARGET_RODATA: load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # Issue #155: build-time SPKI pin (src/cert_pin.s), linked only under
    # HTTPS_PIN_SPKI_SHA256=. CRYPTO_OVERLAY has the room in every profile
    # this cfg serves. CERT_PIN_UI holds the status byte: keep it in RAM.
    CERT_PIN_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;
    # #155 L3: the trust hook (src/cert_pin.s under TRUST_STORE).
    TRUST_HOOK_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;
    CERT_PIN_UI:   load = CRYPTO_OVERLAY, type = rw, optional = yes;

    # #155 phase 2: https_target_prompt (src/boot.s, UCI only), the typed
    # host/path at 'G'. CRYPTO_OVERLAY has the room in every profile this
    # cfg serves; LOADER does not.
    TARGET_PROMPT_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # Issue #155 phase 2: the trust store's on-disk I/O
    # (src/net/uci/uci_dos.s + trust_store.s), linked only under
    # TRUST_STORE=1. The file image is built in the TCP ring at $C000, so
    # this is code plus ~110 B of state; the BSS must stay RAM that
    # nothing else time-shares, since it outlives the handshake.
    TRUST_STORE_CODE: load = CRYPTO_OVERLAY, type = ro,  optional = yes;
    # #155 phase 2 (L3): the trust policy's no-connection code, its
    # prompts, and the signed bundle's check (TRUST_BUNDLE=1). Resident
    # here, wherever the room is; the comb cfgs bank the first and last.
    # TRUST_POLICY_BSS is the policy's resident state.
    TRUST_POLICY_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;
    TRUST_POLICY_RODATA: load = CRYPTO_HOT,   type = ro, optional = yes;
    TRUST_PROMPT_CODE: load = CRYPTO_OVERLAY, type = ro, optional = yes;
    TRUST_PROMPT_RES: load = CRYPTO_OVERLAY,  type = ro, optional = yes;
    TRUST_BUNDLE_CODE: load = LOADER,         type = ro, optional = yes;
    TRUST_STORE_BSS:  load = CRYPTO_OVERLAY, type = bss, optional = yes;
    TRUST_POLICY_BSS: load = CRYPTO_HOT,     type = bss, optional = yes;
    TRUST_POLICY_BSS_RES: load = CRYPTO_HOT, type = bss, optional = yes;

    # --- Resident crypto + TLS code / rodata. ---
    CRYPTO_CODE:     load = CRYPTO_HOT,   type = ro;
    CRYPTO_RODATA:   load = CRYPTO_HOT,   type = ro;
    LIB_X25519_CODE: load = CRYPTO_HOT, type = ro;  # sibling ladder (x25519.s, x25519_init.s)
    X25519_GLUE_CODE: load = CRYPTO_HOT, type = ro;  # src/crypto/x25519_tables.s, same home
    RESIDENT_RODATA: load = CRYPTO_HOT,   type = ro, optional = yes;
    CRYPTO_INIT_CODE: load = CRYPTO_HOT,  type = ro, optional = yes;

    # --- W5: libs/nistcurves segments (c64-lib-contract SPEC §4). ---
    # The P-256 verify primitives are always-resident in CRYPTO_HOT.
    LIB_NISTCURVES_P256_CODE:   load = CRYPTO_HOT, type = ro, optional = yes;
    # CRYPTO_OVERLAY, not CRYPTO_HOT, from the libs/nistcurves v0.14.0 pin.
    # v0.12.0's SPEC 8.2 REU DMA settle added 58 B to LIB_NISTCURVES_P256_CODE
    # (thirteen `jsr nistcurves_reu_dma_wait` sites), more than CRYPTO_HOT
    # had free, so the link failed here:
    #
    #   ld65: Warning: cfg/c64-https-uci.cfg(NNN): Segment
    #         'LIB_NISTCURVES_P256_RODATA' overflows memory area
    #         'CRYPTO_HOT' by 22 bytes
    #
    # (NNN is CRYPTO_HOT's own MEMORY line, not this one — ld65 names the
    # region's declaration. Do not paste a line number here; the comment
    # you are reading moves it.)
    #
    # — 22 B under USE_NISTCURVES_ONCHIP=1 and 59 B under the default REU
    # profile, which shares this cfg. Moving the 192 B of curve/mod
    # constants into CRYPTO_OVERLAY (the roomiest region in both profiles) buys back
    # far more than the deficit and costs the hot region nothing at runtime:
    # CRYPTO_OVERLAY is plain resident RAM at $4200-$5FFF under UCI, it is
    # where LIB_NISTCURVES_MUL_CODE already lives, and cfg/c64-https-uci-onchip.cfg
    # has routed this same segment there since the comb profile existed.
    # It is rodata, so nothing about the cold-shadow zero-fill applies.
    LIB_NISTCURVES_P256_RODATA: load = CRYPTO_OVERLAY, type = ro, optional = yes;
    # P-256 BSS (fp256/mod256/points256 scratch + ecdsa256 input/output
    # staging + data_p256 working buffers) is per-call verify scratch, so
    # it time-shares cert_buf exactly as ip65's SCRATCH_UNION does (#68):
    # cert_buf is dead once x509_extract_pubkey returns (the pubkey, SAN
    # check and SPKI pin all run inside it), and ecdsa_verify runs only
    # after that. Two things would break the union: code RUNNING from
    # cert_buf that calls ecdsa_verify (TRUST_BUNDLE=1 on the comb cold
    # bank; refused by a Makefile $(error) and an lderror in
    # src/net/uci/trust_bundle.s), and anything that re-reads cert_buf
    # after CertificateVerify (the LIFETIME CONTRACT in src/der_decode.s).
    # Do not size harness scratch from it; tools/uci/_memory_policy.py
    # reads build/labels.txt.
    LIB_NISTCURVES_P256_BSS:    load = P256_SCRATCH_UNION, type = bss, optional = yes;
    # The P-256 archive does not include data_shared.o or mul_8x8.o
    # (c64-https provides those — see tools/integration/build_nistcurves_p256.sh),
    # so the LIB_NISTCURVES_BSS / _TABLES / _MUL_CODE segments are
    # declared `optional = yes` for forward compatibility but receive
    # zero bytes today.
    LIB_NISTCURVES_BSS:         load = CRYPTO_COLD_SHADOW, type = bss, optional = yes;
    LIB_NISTCURVES_TABLES:      load = CRYPTO_COLD_SHADOW, type = bss, optional = yes, align = $100;
    # Onchip profile (issue #69): og_common + sqtab equates. Placed in
    # CRYPTO_OVERLAY because the onchip fp256 growth overflows CRYPTO_HOT
    # by ~59 B otherwise.
    LIB_NISTCURVES_MUL_CODE:    load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # --- Resident BSS — routed to CRYPTO_COLD_SHADOW under the W1
    # hot/cold split (Worker I). The BSS / CRYPTO_BSS segments are
    # the catch-all for in-tree c64-https state declarations
    # (src/data.s); landing them in the $A000-$BFFF banked-on RAM
    # slice frees the 16 KB CRYPTO_HOT region for code + rodata
    # (which MUST stay below $A000 because boot zeros that span as
    # zero-init BSS).
    BSS:           load = CRYPTO_COLD_SHADOW, type = bss;
    CRYPTO_BSS:    load = CRYPTO_COLD_SHADOW, type = bss;
    # libs/x25519 (issue #245). X25519_BSS (the sibling's field buffers)
    # is in X25519_SCRATCH, over tls_rec_buf — see the MEMORY block.
    # X25519_TABLES is src/crypto/x25519_tables.s's 2 KB of lookup tables,
    # page-aligned, placed last so it packs against TABLES_BSS.
    X25519_BSS:    load = X25519_SCRATCH, type = bss, align = $20;
    X25519_TABLES: load = CRYPTO_COLD_SHADOW, type = bss, align = $100;
    # TABLES_BSS pins the 1.5 KB sqtab/mul_dma tables on a page
    # boundary. Page alignment is load-bearing for the no-page-penalty
    # `lda abs,Y` addressing in the hot-path multiply routines.
    # start = $BA00 (page-aligned, so the .align 256 requirement is
    # still met): the sibling nistcurves archive reads the shared
    # quarter-square table through equates BAKED to
    # LIB_SHARED_SQTAB_BASE = $BC00 (sqtab_lo at TABLES_BSS+$200), and
    # the Makefile's post-link check asserts it. That address used to
    # fall out of cert_buf packing first in the cold shadow; with
    # CERT_BUF_BSS moved to CRYPTO_OVERLAY (Wikipedia growth) the
    # anchor must be explicit. $BA00 + $600 = $C000 — flush to the
    # region end, exactly the historical placement.
    TABLES_BSS:    load = CRYPTO_COLD_SHADOW, type = bss, start = $BA00;

    # PQ_HYBRID=1 only (all optional). align = $40 on rodata and $100 on the
    # BSS are the library's own rules (cfg/mlkem-example.cfg in libs/mlkem).
    # load = COLD_FILE ($A000, file bytes), run = MLKEM_CODE_RAM ($E000).
    # align_load keeps the load image the same shape as the run image, so
    # one block copy moves both (asserted in src/crypto/mlkem_link.s).
    # PQ_HYBRID=1 only (src/crypto/pq_hybrid.s; optional, so an unset build is
    # byte-identical): the ServerHello machine and the KeyGen/Decaps glue.
    PQ_CODE:       load = LOADER, type = ro, optional = yes;
    PQ_GLUE:       load = NET_CODE, type = ro, optional = yes;
    LIB_MLKEM_CODE:     load = COLD_FILE, run = MLKEM_CODE_RAM, type = ro,  optional = yes, define = yes;
    LIB_MLKEM_RODATA:   load = COLD_FILE, run = MLKEM_CODE_RAM, type = ro,  optional = yes, align = $40, align_load = $40, define = yes;
    # One byte, last in the load image: boot checks it before copying, so a
    # LOAD cut short (or a stage already zeroed) is refused, never half-copied.
    LIB_MLKEM_MARK:     load = COLD_FILE, run = MLKEM_CODE_RAM, type = ro,  optional = yes, define = yes;
    LIB_MLKEM_BSS:      load = MLKEM_BSS_RAM,  type = bss, optional = yes, align = $100, define = yes;
    LIB_MLKEM_POLY_BSS: load = MLKEM_POLY_RAM, type = bss, optional = yes, align = $100, define = yes;
}
