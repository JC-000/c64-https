# c64-https ld65 config — UCI (Ultimate Command Interface) backend
#
# Target: Commodore Ultimate 64 / U64E using the host-visible UCI
# ($DF1B-$DF1F) in place of ip65 + RR-Net.
#
# Post-Phase C.0 memory map (REU-overlay design):
#   $0801-$1FFF : LOADER           (BASIC stub + boot + tls + http + net wrapper)
#   $2000-$3FFF : NET_CODE         (UCI adapter + LOADER_OVERFLOW tail)
#   $4000-$41FF : UCI_BSS          (uci_host_buf + state, 512 B)
#   $4200-$5FFF : CRYPTO_OVERLAY   (7.5 KB swappable overlay slot)
#   $6000-$BFFF : CRYPTO_RESIDENT  (24 KB always-resident crypto + TLS + BSS)
#   $C000-$CFFF : TCP_BUF          (tcp_recv_buf, 4 KB ring)
#
# NOTE on UCI_BSS size: the plan's "256 B" target was optimistic —
# `src/net/uci/net.s` + `uci_cmd.s` allocate ~289 B (uci_host_buf 256 B +
# uci_ipaddr_resp 12 B + uci_socket_id/port/send/poll/... ~16 B +
# uci_resp control block 4 B). Rounded up to the next page (512 B) and
# the overlay slot trimmed accordingly (7.5 KB vs. 8 KB under ip65).
# Overlay images ship as 8 KB files; under UCI the extra 512 B at the
# tail are unused (overlay ends at $5FFF; 8 KB would end at $61FF and
# overrun CRYPTO_RESIDENT). The individual library `build.sh` size
# assertions must account for this backend-specific ceiling.
#
# CRYPTO_RESIDENT is 24 KB on UCI (vs 16 KB target on ip65) because UCI
# does not need $4000-$5FFF for backend BSS, letting CRYPTO_RESIDENT
# start at $6000 and claim the former NET_BSS space via a lower overlay
# anchor. The extra 8 KB budget is what lets UCI host ccp Profile A
# (Shoup 8 KB BSS below $A000 invariant) where ip65 is forced to
# Profile B.
#
# --- Phase C.1 layout ---
# UCI implements the REU-overlay layout from the plan
# (/home/someone/.claude/plans/synchronous-baking-curry.md, "Phase B
# final decision"): CRYPTO_RESIDENT 24 KB split across a 6 KB pre-SQTAB
# region + a 17 KB post-SQTAB region with a 1 KB sqtab hole at
# $7800-$7BFF, plus CRYPTO_OVERLAY 7.5 KB at $4200-$5FFF and UCI_BSS
# 512 B at $4000-$41FF.
#
# Phase C.1 lands the c64-x25519 sibling as the first real overlay
# image (libs/x25519/ submodule, build/lib/x25519.a). OVERLAY_X25519
# receives the sibling's runtime (~3.5 KB of 7.5 KB budget); the
# init-only code + DATA tables + BSS flow into the split CRYPTO_RESIDENT
# halves. $7800-$7BFF is a deliberate zero-fill hole for the sibling's
# hardcoded sqtab_lo/hi tables, populated at boot by `x25519_sqtab_init`.
#
# The ip65 cfg continues to use the in-tree x25519/fe25519 sources
# (Phase C.2 will enable the overlay there once ccp Profile B frees
# enough CRYPTO_RESIDENT headroom).

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_CRYPTO:   start = $0022, size = $001E, type = rw, define = yes;
    ZP_WIDE:     start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:       start = $07FF, size = $0002, file = %O;
    LOADER:         start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    NET_CODE:       start = $2000, size = $2000, file = %O, define = yes, fill = yes, fillval = $00;
    UCI_BSS_REGION: start = $4000, size = $0200, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO_OVERLAY: start = $4200, size = $1E00, file = %O, define = yes, fill = yes, fillval = $00;
    # Phase C.1: CRYPTO_RESIDENT is split around a 1 KB hole at
    # $7800-$7BFF reserved for the sibling's quarter-square tables
    # (`sqtab_lo = $7800`, `sqtab_hi = $7a00`, hardcoded in the sibling's
    # mul_8x8 module). The hole ships as zero-fill in the PRG; the sibling
    # builds the 1 KB table at boot via `x25519_sqtab_init`.
    CRYPTO_RESIDENT:   start = $6000, size = $1800, file = %O, define = yes, fill = yes, fillval = $00;
    X25519_SQTAB:      start = $7800, size = $0400, file = %O, define = yes, fill = yes, fillval = $00;
    CRYPTO_RESIDENT_2: start = $7C00, size = $4400, file = %O, define = yes, fill = yes, fillval = $00;

    TCP_BUF:     start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE:      load = ZP_CRYPTO,      type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,        type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,       type = ro;
    EXEHDR:        load = LOADER,         type = ro;
    STARTUP:       load = LOADER,         type = ro,  optional = yes;
    CODE:          load = LOADER,         type = ro;
    RODATA:        load = CRYPTO_RESIDENT_2, type = ro;
    INIT:          load = LOADER,         type = ro,  optional = yes;

    # NET_CODE hosts the UCI adapter + the LOADER_OVERFLOW tail.
    # Phase C.2 (UCI only): TLS_CODE and CRYPTO_AUX_CODE (SHA-256,
    # HMAC-DRBG, ecdsa_verify dispatcher) are relocated here as well
    # to open headroom in CRYPTO_RESIDENT for Phase C.3's P-256/P-384
    # sibling integration. The UCI adapter is ~1.7 KB so NET_CODE has
    # ~6.3 KB free after UCI_CODE + LOADER_OVERFLOW; TLS_CODE ~1.8 KB
    # + CRYPTO_AUX_CODE ~3 KB fits with room to spare.
    NET_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    UCI_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    LOADER_OVERFLOW: load = NET_CODE,     type = ro,  optional = yes;
    TLS_CODE:      load = NET_CODE,       type = ro,  optional = yes;
    CRYPTO_AUX_CODE: load = NET_CODE,     type = ro,  optional = yes;
    UCI_BSS:       load = UCI_BSS_REGION, type = bss, optional = yes;

    # --- Overlay slot: one of {x25519, p256, p384} at any given time. ---
    # All three OVERLAY_<lib> segments share the same load address; ld65
    # emits whichever ones the current link set supplies. Phase C.1:
    # OVERLAY_X25519 carries the c64-x25519 sibling runtime (fe25519,
    # x25519, mul_8x8 runtime). Asserts at link time that it fits the
    # 7.5 KB UCI ceiling (CRYPTO_OVERLAY region = $1E00).
    OVERLAY_X25519: load = CRYPTO_OVERLAY, type = ro, optional = yes;
    OVERLAY_P256:   load = CRYPTO_OVERLAY, type = ro, optional = yes;
    OVERLAY_P384:   load = CRYPTO_OVERLAY, type = ro, optional = yes;

    # --- Resident crypto + TLS code / rodata. ---
    # Phase C.1: CRYPTO_RESIDENT ($6000-$77FF, 6 KB) holds small RO
    # segments that fit in 6 KB; the main CRYPTO_CODE body lives in
    # CRYPTO_RESIDENT_2 ($7C00+). The $7800-$7BFF hole is reserved
    # for the sibling's hardcoded sqtab_lo/hi.
    CRYPTO_CODE:   load = CRYPTO_RESIDENT_2, type = ro;
    CRYPTO_RODATA: load = CRYPTO_RESIDENT_2, type = ro;
    # Push RESIDENT_RODATA, CRYPTO_INIT_CODE into the 6 KB pre-SQTAB
    # region ($6000-$77FF) so it isn't wasted zero-fill.
    # (Phase C.2: TLS_CODE and CRYPTO_AUX_CODE moved to NET_CODE —
    # see the NET_CODE block above.)
    RESIDENT_RODATA: load = CRYPTO_RESIDENT, type = ro, optional = yes;
    CRYPTO_INIT_CODE: load = CRYPTO_RESIDENT, type = ro, optional = yes;
    # Phase C.1: sibling-lib DATA segment (page-aligned RW buffers and
    # initialized lookup tables emitted with .byte content). Kept below
    # $A000 per the "lookup tables below $A000" invariant. align=$100
    # so the sibling's `.align 256` inside the segment lands on a page
    # boundary (required by fe25519's self-mod abs,Y addressing). Placed
    # in CRYPTO_RESIDENT (pre-SQTAB) because CRYPTO_RESIDENT_2 is full
    # with CRYPTO_CODE + BSS.
    DATA:          load = CRYPTO_RESIDENT, type = rw, optional = yes, align = $100;

    # --- Resident BSS. ---
    # Balance load across both region halves.
    BSS:           load = CRYPTO_RESIDENT_2, type = bss;
    CRYPTO_BSS:    load = CRYPTO_RESIDENT_2, type = bss;
    TABLES_BSS:    load = CRYPTO_RESIDENT_2, type = bss, align = $100;
    # Phase C.1: sibling's hardcoded 1 KB quarter-square table at
    # $7800/$7a00. Reserved as a zero-fill hole in the PRG; built at
    # boot by `x25519_sqtab_init` (see src/crypto/shared/crypto_init.s).
    X25519_SQTAB:  load = X25519_SQTAB, type = rw, optional = yes;

    TCP_RECV_BUF:  load = TCP_BUF,         type = bss, optional = yes;
}
