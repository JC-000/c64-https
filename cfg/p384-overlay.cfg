# cfg/p384-overlay.cfg — minimal ld65 config for extracting the P-384
# OVERLAY image as a standalone binary, used only by
# `tools/integration/build_nistcurves_p384_bin.sh`.
#
# NOT USED by the main c64-https PRG build. The production PRG does NOT
# link the P-384 archive (Phase C.3b keeps P-384 external / smoke-test-only);
# this cfg exists purely so we can extract a padded 8 KB binary image plus
# a VICE-format labels file that `tools/test_p384_symbols.py` loads into
# REU at harness time.
#
# Layout:
#   $4200-$61FF : OVERLAY_P384 region (8 KB, padded with $00). Matches the
#                 CRYPTO_OVERLAY base under the UCI cfg so the image DMAs
#                 into the live overlay slot cleanly at harness time.
#   $C000-$CFFF : RESIDENT — holds the P-384 RW buffers (DATA / BSS).
#                 These addresses intentionally land inside TCP_BUF
#                 ($C000-$CFFF) because networking is NOT active during
#                 the P-384 smoke test — the TCP ring is free space.
#                 This avoids clashing with the main PRG's CRYPTO code
#                 segments at $7C00-$BFFF which remain live.

FEATURES {
    STARTADDRESS: default = $4200;
}

MEMORY {
    ZP:             start = $0022, size = $001E, type = rw, define = yes;
    OVERLAY_REGION: start = $4200, size = $2000, file = %O, define = yes,
                    fill = yes, fillval = $00;
    RESIDENT:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE:       load = ZP,             type = zp,  optional = yes;

    OVERLAY_P384:   load = OVERLAY_REGION, type = ro;

    # Resident RW buffers — we don't write them to the .bin, but they
    # need real addresses so labels are correct.
    DATA:           load = RESIDENT,       type = rw,  optional = yes;
    BSS:            load = RESIDENT,       type = bss, optional = yes;
}
