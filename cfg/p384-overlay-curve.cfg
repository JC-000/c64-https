# cfg/p384-overlay-curve.cfg — ld65 config for the curve / verify half of
# the split P-384 overlay (Phase 1.5).
#
# Holds: fp384, mod384, points384 (post Lim-Lee strip), curve384,
# ecdsa384 (verify_384 ONLY — the verify_with_message_384 wrapper that
# imports sha384_init/update/final is dropped here; TLS calls the SHA
# overlay separately and pre-stages the digest into the resident DATA
# struct), and the ec_scalar_mul_384 -> ec_scalar_mul_var_384 shim.
#
# Loaded into the live UCI CRYPTO_OVERLAY slot ($4200-$5FFF, 7.5 KB)
# AFTER the sha384 half has done its work.  The TLS dispatcher sequence:
#   1. swap-in sha384 overlay -> sha384_init / update* / final
#   2. swap-in curve  overlay -> ecdsa_verify_384
# The 240 B BE input struct (ecdsa_inputs_384) and the 48 B SHA digest
# (sha384_digest) live in CRYPTO_RESIDENT DATA at $C000 so they survive
# the swap.
#
# Layout matches the live UCI CRYPTO_OVERLAY base ($4200) and size
# ($1E00 = 7.5 KB) so the .bin DMAs into the live slot cleanly at
# harness time.

FEATURES {
    STARTADDRESS: default = $4200;
}

MEMORY {
    ZP:             start = $0022, size = $001E, type = rw, define = yes;
    OVERLAY_REGION: start = $4200, size = $1E00, file = %O, define = yes,
                    fill = yes, fillval = $00;
    RESIDENT:       start = $C000, size = $1000, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE:                       load = ZP,             type = zp,  optional = yes;

    # W5: new library segment names (c64-lib-contract / libs/nistcurves
    # cfa9085+). The legacy OVERLAY_P384_CURVE alias remains for the
    # in-staging shim (build_nistcurves_p384.sh emits
    # ec_scalar_mul_384_shim.s with this segment name).
    # LIB_NISTCURVES_P384_* is the canonical set under the contract.
    OVERLAY_P384_CURVE:             load = OVERLAY_REGION, type = ro, optional = yes;
    LIB_NISTCURVES_P384_CODE:       load = OVERLAY_REGION, type = ro, optional = yes;
    LIB_NISTCURVES_P384_RODATA:     load = OVERLAY_REGION, type = ro, optional = yes;

    # Resident RW buffers — we don't write them to the .bin, but they
    # need real addresses so labels are correct.
    DATA:                           load = RESIDENT,       type = rw,  optional = yes;
    BSS:                            load = RESIDENT,       type = bss, optional = yes;
    LIB_NISTCURVES_P384_BSS:        load = RESIDENT,       type = bss, optional = yes;
    LIB_NISTCURVES_P384_DATA_BSS:   load = RESIDENT,       type = rw,  optional = yes;
}
