# ld65 linker configuration for ip65 binary blob
# Places ip65 code + BSS at $2000 for inclusion in ACME project via !binary
#
# Build: ld65 -C ip65.cfg -o ip65-c64.bin <object files>
#
# Zero page: $1C-$35 (avoids crypto ZP $02-$12 and ChaCha20/Poly1305 $14-$1D)
# Note: even though we time-share ZP, placing ip65 at $02-$1B (cc65 default)
# is fine since we save/restore. This config is here in case we later want
# to eliminate the save/restore overhead for a specific hot path.

MEMORY {
    ZP:     file = "", define = yes, start = $0002, size = $001A;
    HEADER: file = %O,               start = $2000, size = $0006;
    MAIN:   file = %O, define = yes, start = $2006, size = $1FFA;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    JUMPTAB:  load = HEADER, type = ro;           # fixed-offset jump table
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    BSS:      load = MAIN,   type = bss, define = yes;
}
